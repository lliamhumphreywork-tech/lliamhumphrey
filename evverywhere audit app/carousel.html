<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Evvrywhere — Speed-to-Lead Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Libre+Caslon+Display&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#F5F0E8;
    --ink:#1A1A1A;
    --brown:#6B4C2A;
    --white:#FFFFFF;
    --ink-70: rgba(26,26,26,.66);
    --ink-45: rgba(26,26,26,.45);
    --ink-30: rgba(26,26,26,.3);
    --line: rgba(26,26,26,.16);
    --brown-12: rgba(107,76,42,.12);
    --brown-20: rgba(107,76,42,.22);
    --serif: 'DM Serif Display', Georgia, serif;
    --sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --logo: var(--ink);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:#23211d;
    font-family: var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow:hidden;
  }
  #root{ height:100vh; }

  /* ============ SLIDE CANVAS ============ */
  .slide{
    width:1080px; height:1350px;
    background:var(--cream);
    position:relative;
    overflow:hidden;
    display:grid;
    grid-template-rows: auto auto 1fr auto;
    padding:84px 84px 70px;
  }
  .slide.landscape{ width:1200px; height:627px; padding:64px 90px; grid-template-rows:auto auto 1fr; }

  /* header */
  .s-head{ display:flex; align-items:center; justify-content:space-between; gap:24px; }
  .kicker{
    font-family:var(--sans); font-size:21px; font-weight:500;
    letter-spacing:.16em; text-transform:uppercase; color:var(--ink);
    display:flex; align-items:center; gap:14px;
  }
  .kicker .dot{ width:9px; height:9px; background:var(--brown); border-radius:50%; display:inline-block; }
  .pill{
    font-family:var(--sans); font-size:19px; font-weight:600;
    letter-spacing:.12em; text-transform:uppercase;
    background:var(--brown); color:var(--white);
    padding:13px 28px; border-radius:999px; white-space:nowrap;
  }
  .pill.outline{ background:transparent; color:var(--brown); box-shadow: inset 0 0 0 2px var(--brown); }
  .rule{ height:1.5px; background:var(--ink); margin-top:34px; opacity:.9; }

  /* headline block */
  .head-block{ margin-top:60px; align-self:start; }
  .headline{
    font-family:var(--serif); font-weight:400;
    color:var(--ink); line-height:.98; letter-spacing:-.006em;
    margin:0; text-wrap:balance;
  }
  .headline em{ font-style:italic; }
  .headline .acc{ color:var(--brown); }
  .dek{
    font-family:var(--sans); font-size:27px; line-height:1.4; font-weight:400;
    color:var(--ink-70); margin:30px 0 0; max-width:760px;
  }

  /* visual zone */
  .vzone{ align-self:stretch; min-height:0; display:flex; flex-direction:column; justify-content:center; }

  /* footer / logo */
  .s-foot{ display:flex; align-items:flex-end; justify-content:center; position:relative; margin-top:24px; }
  .wmark{ height:40px; width:auto; display:block; }
  .page-num{
    position:absolute; right:0; bottom:2px;
    font-family:var(--sans); font-size:19px; letter-spacing:.16em;
    color:var(--ink-45); font-weight:500;
  }
  .corner-id{
    position:absolute; left:0; bottom:2px;
    font-family:var(--sans); font-size:19px; letter-spacing:.16em;
    color:var(--ink-45); font-weight:500; text-transform:uppercase;
  }

  /* ============ shared visual primitives ============ */
  .chip{ width:34px; height:34px; border-radius:7px; background:var(--ink); }
  .chip.brown{ background:var(--brown); }
  .chip.ghost{ background:transparent; box-shadow: inset 0 0 0 2px var(--brown-20); }
  .chip-row{ display:flex; flex-wrap:wrap; gap:14px; }

  .stat-caption{ font-family:var(--sans); font-size:23px; color:var(--ink-70); line-height:1.4; }
  .footnote{ font-family:var(--sans); font-size:18px; color:var(--ink-45); letter-spacing:.02em; }
  .lbl{ font-family:var(--sans); font-size:20px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink); }
  .lbl.muted{ color:var(--ink-45); font-weight:500; }

  /* bar (stat) */
  .bar{ width:100%; height:84px; border-radius:14px; overflow:hidden; display:flex; background:var(--white); box-shadow: inset 0 0 0 1.5px var(--line); }
  .bar .seg-a{ background:var(--brown); }
  .bar .seg-b{ background:var(--brown-12); }

  /* card (chat / dashboard) */
  .card{ background:var(--white); border-radius:26px; box-shadow: inset 0 0 0 1.5px var(--line); padding:34px 36px; }
  .card-head{ display:flex; align-items:center; gap:18px; padding-bottom:24px; border-bottom:1.5px solid var(--line); margin-bottom:26px; }
  .avatar{ width:54px; height:54px; border-radius:50%; background:var(--brown); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:600; font-size:22px; font-family:var(--sans); }

  .bubble{ max-width:74%; padding:22px 26px; border-radius:22px; font-family:var(--sans); font-size:25px; line-height:1.32; }
  .bubble .time{ display:block; font-size:17px; color:var(--ink-45); margin-top:10px; letter-spacing:.02em; }
  .bubble.in{ background:var(--cream); color:var(--ink); border-bottom-left-radius:7px; align-self:flex-start; }
  .bubble.out{ background:var(--brown); color:#fff; border-bottom-right-radius:7px; align-self:flex-end; }
  .bubble.out .time{ color: rgba(255,255,255,.7); }
  .thread{ display:flex; flex-direction:column; gap:20px; }
  .gap-chip{ align-self:center; font-family:var(--sans); font-size:18px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-45); background:var(--cream); padding:9px 20px; border-radius:999px; box-shadow: inset 0 0 0 1.5px var(--line); }

  /* flow nodes */
  .flow{ display:flex; flex-direction:column; gap:0; }
  .node{ display:flex; align-items:center; gap:28px; }
  .node .num{ width:64px; height:64px; flex:0 0 64px; border-radius:50%; background:var(--brown); color:#fff; font-family:var(--serif); font-size:30px; display:flex; align-items:center; justify-content:center; }
  .node .num.ghost{ background:transparent; color:var(--brown); box-shadow: inset 0 0 0 2px var(--brown); }
  .node .body .t{ font-family:var(--sans); font-size:30px; font-weight:600; color:var(--ink); letter-spacing:-.01em; }
  .node .body .s{ font-family:var(--sans); font-size:22px; color:var(--ink-70); margin-top:4px; }
  .connector{ width:64px; display:flex; justify-content:center; }
  .connector .line{ width:2px; height:34px; background:var(--brown-20); }

  /* stat tiles (dashboard) */
  .tiles{ display:flex; flex-direction:column; gap:20px; }
  .tile{ display:flex; align-items:center; justify-content:space-between; gap:24px; padding:26px 30px; border-radius:18px; background:var(--cream); }
  .tile .name{ font-family:var(--sans); font-size:23px; color:var(--ink-70); font-weight:500; }
  .tile .vals{ display:flex; align-items:baseline; gap:18px; }
  .tile .before{ font-family:var(--sans); font-size:26px; color:var(--ink-45); text-decoration:line-through; }
  .tile .arrow{ color:var(--brown); font-size:24px; }
  .tile .after{ font-family:var(--serif); font-size:42px; color:var(--ink); line-height:1; }

  /* ============ entry animations ============ */
  @media (prefers-reduced-motion: no-preference){
    .stage[data-animate="on"] .head-block{ animation: fadeUp .62s cubic-bezier(.2,.7,.2,1) both; }
    .stage[data-animate="on"] .s-head{ animation: fadeUp .5s cubic-bezier(.2,.7,.2,1) both; }
    .stage[data-animate="on"] .vzone{ animation: slideInR .7s cubic-bezier(.2,.7,.2,1) .12s both; }
    .stage[data-animate="on"] .s-foot{ animation: fadeUp .5s ease .2s both; }
  }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(26px); } to{ opacity:1; transform:none; } }
  @keyframes slideInR{ from{ opacity:0; transform:translateX(70px); } to{ opacity:1; transform:none; } }

  /* ============ APP CHROME ============ */
  .stage{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .scaled{ transform-origin: top left; box-shadow: 0 40px 120px rgba(0,0,0,.45); }

  .topbar{
    position:fixed; top:0; left:0; right:0; height:58px; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; background: rgba(20,19,16,.82); backdrop-filter: blur(10px);
    color:#e9e4da; font-family:var(--sans); font-size:14px;
  }
  .topbar .brand{ display:flex; align-items:center; gap:11px; font-weight:600; letter-spacing:.04em; }
  .topbar .brand .w{ height:17px; width:auto; display:block; }
  .seg{ display:flex; background:rgba(255,255,255,.08); border-radius:999px; padding:4px; gap:2px; }
  .seg button{ border:0; background:transparent; color:#b8b1a4; font:inherit; font-weight:600; padding:7px 18px; border-radius:999px; cursor:pointer; letter-spacing:.02em; }
  .seg button.on{ background:#e9e4da; color:#1a1a1a; }
  .topbar .meta{ color:#8c857a; font-variant-numeric:tabular-nums; min-width:90px; text-align:right; }

  /* swipe nav */
  .nav{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:50; display:flex; align-items:center; gap:18px; background:rgba(20,19,16,.82); backdrop-filter:blur(10px); padding:10px 14px; border-radius:999px; }
  .nav button{ width:46px; height:46px; border-radius:50%; border:0; background:rgba(255,255,255,.1); color:#e9e4da; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s; }
  .nav button:hover{ background:rgba(255,255,255,.2); }
  .nav button:disabled{ opacity:.3; cursor:default; }
  .dots{ display:flex; gap:9px; align-items:center; padding:0 6px; }
  .dots i{ width:8px; height:8px; border-radius:50%; background:rgba(233,228,218,.32); cursor:pointer; transition:all .2s; }
  .dots i.on{ background:#e9e4da; transform:scale(1.3); }

  /* review grid */
  .review{ position:absolute; inset:0; overflow:auto; background:#23211d; padding:78px 40px 80px; }
  .review-inner{ max-width:1320px; margin:0 auto; }
  .review h2{ color:#e9e4da; font-family:var(--serif); font-weight:400; font-size:34px; margin:0 0 6px; }
  .review .sub{ color:#8c857a; font-family:var(--sans); font-size:15px; margin:0 0 34px; max-width:680px; line-height:1.5; }
  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(300px,1fr)); gap:34px 30px; }
  .cell { }
  .cell .cap{ display:flex; align-items:center; gap:10px; color:#cfc8ba; font-family:var(--sans); font-size:13px; margin-bottom:12px; font-weight:600; letter-spacing:.04em; }
  .cell .cap .n{ color:#8c857a; }
  .cell .cap .flag{ margin-left:auto; background:var(--brown); color:#fff; font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding:4px 9px; border-radius:5px; font-weight:700; }
  .frame{ border-radius:8px; overflow:hidden; box-shadow:0 18px 50px rgba(0,0,0,.4); position:relative; }
  .review .section-h{ color:#8c857a; font-family:var(--sans); font-size:12px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; margin:48px 0 22px; padding-bottom:12px; border-bottom:1px solid rgba(255,255,255,.1); }
  .note-card{ background:rgba(255,255,255,.05); border-radius:14px; padding:22px 24px; color:#cfc8ba; font-family:var(--sans); font-size:14px; line-height:1.6; }
  .note-card b{ color:#e9e4da; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {

  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

    </div>
  );
}
// landscape thumb width helper (responsive-ish, capped)
function vw() {
  const inner = Math.min(1320, window.innerWidth - 80);
  return Math.max(420, inner - 350);
}
