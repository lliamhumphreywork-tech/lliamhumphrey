function parseRandNum(str) {
  if (!str) return 0;
  const s = String(str).replace(/\s/g, '');
  const n = parseFloat(s.replace(/[^0-9.]/g, ''));
  if (isNaN(n)) return 0;
  if (/m(?:illion)?/i.test(s)) return n * 1000000;
  if (/k(?:ilo|thousand)?/i.test(s)) return n * 1000;
  return n;
}

function fmtR(n) {
  if (!n) return '';
  return 'R ' + Math.round(n).toLocaleString('en-ZA').replace(/,/g, ' ');
}

function detectCat(text) {
  if (/supplier|pric(?:ing|e)|overmarket|overcharg|fee|margin|markup|cost(?:ing| over)|bulk.buy|material|purchasing|overspend/i.test(text)) return 'Money Leak';
  if (/follow.?up|referral|repeat.client|new client|pipeline|lead|retention|upsell|lost.revenue|no.client|marketing|word.of.mouth|website|growth/i.test(text)) return 'Revenue Gap';
  if (/onboard|training|ramp.time|staff|new.hire|document|knowledge|handover|shadow|turnover|poach|retention|recruit/i.test(text)) return 'Staff Friction';
  return 'Tech Debt';
}

function issueToFix(name) {
  return name
    .replace(/^[-–]\s*/,'')
    .replace(/^no\s+/i, 'Implement ')
    .replace(/^zero\s+/i, 'Create ')
    .replace(/^lack of\s+/i, 'Build ')
    .replace(/^manual\s+/i, 'Automate ')
    .replace(/founder bottleneck on\s*/i, 'Delegation framework for ')
    .replace(/not renegotiated.*$/i, 'renegotiation programme')
    .replace(/sent\s+\d+.*late.*$/i, 'automation')
    .replace(/\s+in \d+ years?.*$/i, '')
    .replace(/\s*--\s*estimated.*$/i, '')
    .replace(/[,.]$/, '')
    .trim();
}

function generateAuditFromEntry() {
  const title  = document.getElementById('wr-ed-title')?.value || '';
  const rawBody = document.getElementById('wr-ed-body')?.value || '';
  if (!rawBody.trim()) { alert('Entry is empty -- add your session notes first.'); return; }

  // ── Pre-process: merge wrapped dialogue continuation lines ──
  // Lines that start with lowercase and follow a dialogue/continuation line are joined
  const rawLines = rawBody.split('\n');
  const merged = [];
  for (let i = 0; i < rawLines.length; i++) {
    const t = rawLines[i].trim();
    const isDialogue = /^[A-Za-z][a-zA-Z .'-]{1,40}:\s/.test(t);
    const isCont = t.length > 0 && /^[a-z]/.test(t) && !isDialogue && !/^[-•]/.test(t);
    const prev = merged[merged.length - 1] || '';
    const prevIsDialogueOrCont = /^[A-Za-z][a-zA-Z .'-]{1,40}:\s/.test(prev.trim())
      || (/^[a-z]/.test(prev.trim()) && prev.trim().length > 0);
    if (isCont && merged.length > 0 && prevIsDialogueOrCont) {
      merged[merged.length - 1] += ' ' + t;
    } else {
      merged.push(rawLines[i]);
    }
  }
  const body = merged.join('\n');

  // ── Extract client name from title ──
  // If title has "Company -- Person" format, take only what's before the separator
  const _sepIdx = title.search(/\s*[–-]\s*/);
  const _titleBase = _sepIdx > 0 ? title.slice(0, _sepIdx) : title;
  const clientName = _titleBase
    .replace(/\b(transcript|session|notes|audit|founder|team|interview|dump|visit|ops|CEO|CTO|MD|CFO|COO|HR|VP|Director|Manager|meeting|call|review)\b/gi, '')
    .replace(/[&|:–-]/g, ' ')
    .replace(/\s{2,}/g, ' ').trim();

  // ── Hyphen-aware name token: supports "Jean-Pierre", "O'Brien", "Van Rensburg" ──
  // W = one name word (letters, hyphens, apostrophes)
  // NAME = 2–3 such words separated by spaces
  // (used as inline regex fragments, not new RegExp, to keep patterns readable)

  // ── Build founder name set ──
  const intro = body.split('\n').slice(0, 10).join(' ');
  const founderNames = new Set();
  let fi;
  // Pattern A: "Name … MD/CEO/CTO/founder" -- hyphen-aware
  const introFounderRe = /([A-Za-z][A-Za-z'-]*(?:\s+[A-Za-z][A-Za-z'-]*){1,2})[^.\n]*?\b(?:MD|CEO|CTO|co-?founder|founder|director|owner|managing director)\b/gi;
  while ((fi = introFounderRe.exec(body)) !== null) founderNames.add(fi[1].toLowerCase());
  // Pattern B: informal intros -- "spoke to / met / session with [Name]"
  const informalRe = /(?:spoke to|met with?|visited|session with|talked to|call with|spoke with|interview with)\s+([A-Za-z][A-Za-z'-]*(?:\s+[A-Za-z][A-Za-z'-]*){1,2})/gi;
  while ((fi = informalRe.exec(intro)) !== null) founderNames.add(fi[1].toLowerCase());
  // Pattern C: "Name, CEO/CTO/MD" in intro header lines
  const nameTitleRe = /([A-Za-z][A-Za-z'-]*(?:\s+[A-Za-z][A-Za-z'-]*){1,2})\s*,\s*(?:CEO|CTO|MD|Founder|Co-?Founder|Director|Owner)/gi;
  while ((fi = nameTitleRe.exec(intro)) !== null) founderNames.add(fi[1].toLowerCase());

  // ── Founder name & title for form fields ──
  let founderName = '';
  let founderTitle = 'Founder & MD';
  // Known title words (won't accidentally consume location names)
  const TITLE_RE = '(?:CEO|CTO|MD|CFO|COO|Founder|Co-?Founder|Director|Owner|Managing\\s+Director|Managing\\s+Partner|GM|Principal)(?:\\s*&\\s*(?:CEO|CTO|MD|CFO|COO|Founder|Director|Owner|Managing\\s+Director|Managing\\s+Partner|GM|Principal))?';
  // Try: "session/meeting/interview with Name[, Title]"
  const fdrFormal = intro.match(new RegExp('(?:session|meeting|interview)\\s+with\\s+([A-Za-z][A-Za-z\'-]*(?:\\s+[A-Za-z][A-Za-z\'-]*){1,2})[,.]?\\s*(' + TITLE_RE + ')?', 'i'));
  // Try: "spoke to / met / visited Name"
  const fdrInformal = intro.match(/(?:spoke to|met with?|visited|talked to|call with)\s+([A-Za-z][A-Za-z'-]*(?:\s+[A-Za-z][A-Za-z'-]*){1,2})[,\s]/i);
  // Try: "Name, CEO/CTO/Founder[& MD]" in intro
  const fdrTitle = intro.match(new RegExp('([A-Za-z][A-Za-z\'-]*(?:\\s+[A-Za-z][A-Za-z\'-]*){1,2})\\s*,\\s*(' + TITLE_RE + ')', 'i'));

  if (fdrFormal) {
    founderName  = fdrFormal[1].trim().replace(/\b\w/g, c => c.toUpperCase());
    if (fdrFormal[2]) founderTitle = fdrFormal[2].replace(/of\s+.*/i, '').trim();
  } else if (fdrTitle) {
    founderName  = fdrTitle[1].trim().replace(/\b\w/g, c => c.toUpperCase());
    founderTitle = (fdrTitle[2] || '').trim();
  } else if (fdrInformal) {
    founderName  = fdrInformal[1].trim().replace(/\b\w/g, c => c.toUpperCase());
  }

  // Fallback: first dialogue speaker (often the founder/CEO who drives the session)
  if (!founderName) {
    const firstSpM = body.match(/^([A-Za-z][A-Za-z'-]*(?:\s+[A-Za-z][A-Za-z'-]*){1,2}):\s/m);
    if (firstSpM) {
      const sp = firstSpM[1].trim();
      const notNameFallback = /\b(he|she|main|key|probl|issue|mention|activ|section|said|note|total|summary|things?)\b/i;
      if (sp.split(/\s+/).length <= 3 && !notNameFallback.test(sp)) {
        founderName = sp.replace(/\b\w/g, c => c.toUpperCase());
      }
    }
  }

  // ── Helpers ──
  // Extract annual rand value from a line -- handles ranges, per-month, per-year
  function extractIssueVal(line) {
    // Range: "R 75 000 to R 100 000" -- take higher
    const range = line.match(/R[\s]?([\d\s,]+)\s*(?:to|-)\s*R[\s]?([\d\s,]+)/i);
    if (range) {
      const hi = parseFloat(range[2].replace(/[\s,]/g,''));
      // Only multiply by 12 if "per month"/"monthly" appears AFTER the R value (within 50 chars)
      const afterR = line.slice(line.indexOf(range[0]) + range[0].length);
      const isMonth = /^.{0,50}(?:per\s*month|\/\s*month\b|monthly)/i.test(afterR);
      return fmtR(isMonth ? hi * 12 : hi) + ' / yr';
    }
    const single = line.match(/R[\s]?([\d\s,]+(?:\s*(?:k|K|m|M|million|thousand))?)\s*(?:per year|\/\s*yr|a year|per annum)?/i);
    if (!single) return '';
    const n = parseRandNum('R ' + single[1].trim());
    if (!n) return '';
    // Only multiply by 12 if "per month" appears close after the R value
    const rIdx = line.indexOf(single[0]);
    const afterRSingle = rIdx >= 0 ? line.slice(rIdx, rIdx + 60) : '';
    const isMonth = /per\s*month|\/\s*month\b|monthly/i.test(afterRSingle);
    return fmtR(isMonth ? n * 12 : n) + ' / yr';
  }

  // Clean issue name -- strip value/estimate/suffix
  function cleanIssueName(raw) {
    return raw
      .replace(/\s*[–-]\s*estimated.*$/i, '')
      .replace(/\s*is causing an estimated.*$/i, '')
      .replace(/\s*--\s*R[\d\s,kmKM]+.*$/i, '')
      .replace(/\s*estimated\s+(?:cost|value|impact).*$/i, '')
      .replace(/\s*(?:roughly|about|approximately)\s*R[\d\s,.kmKM]+.*$/i, '')
      // IMPORTANT: no /i flag here -- uppercase R only, to avoid stripping 'r' in words like "customer"
      .replace(/\s*\bR\s*\d[\d\s,]*(?:\s*(?:k|m|M|million|thousand))?\s*(?:[Pp]er\s*(?:month|year)|\/\s*(?:yr|month))?.*$/, '')
      .replace(/^[-•]\s*/,'')
      .replace(/[,.]$/, '')
      .trim()
      .slice(0, 90);
  }

  function issueSev(name) {
    return /critical|bottleneck|founder|never|no system|zero/i.test(name) ? 'critical'
         : /manual|late|delay|overdue|overmarket|risk|losing|missed|poach/i.test(name) ? 'high'
         : 'medium';
  }

  // ── Extract issues ──
  const issues = [];

  // Strategy 1: bullet points (- or •)
  const bulletRe = /^[-•]\s*(.+)/gm;
  let m;
  while ((m = bulletRe.exec(body)) !== null) {
    const line = m[1].trim();
    if (line.length < 15) continue;
    // Skip activity/time lines -- they belong in the activities section, not issues
    if (/\d+\s*h(?:ours?|rs?)?\s*(?:\/\s*(?:week|wk)|a\s+week|per\s+week)/i.test(line)) continue;
    const val  = extractIssueVal(line);
    const name = cleanIssueName(line);
    if (name.length < 8) continue;
    issues.push({ name, detail: '', val, sev: issueSev(name), from: '' });
  }

  // Narrative starters that indicate a sentence fragment, not an issue label
  const narrativeStartRe = /^(he\s|she\s|it\s|they\s|we\s|his\s|her\s|our\s|said\s|feels?\s|felt\s|probably|maybe|i\s|there\s|its\s|this\s)/i;

  // Strategy 1.5: bare lines with rand values (messy transcripts -- no bullet prefix)
  if (issues.length < 3) {
    const dlRe = /^[A-Za-z][a-zA-Z .'-]{1,40}:\s/;
    const skipRe = /^(note|key|total|summary|rough|section|step|the|this|that|a|an)[\s:]/i;
    body.split('\n').forEach(line => {
      const l = line.trim();
      if (l.length < 20 || /^[-•]/.test(l) || dlRe.test(l) || skipRe.test(l)) return;
      if (narrativeStartRe.test(l)) return; // handled by Strategy 1.6 below
      const val = extractIssueVal(l);
      if (!val) return;
      const name = cleanIssueName(l);
      if (name.length < 8) return;
      if (issues.some(x => x.name.slice(0,20) === name.slice(0,20))) return;
      issues.push({ name, detail: '', val, sev: issueSev(name), from: '' });
    });
  }

  // Strategy 1.6: narrative sentences with R values -- infer issue name from keywords
  // Handles note-style transcripts: "He misses 5 calls a day -- R 3K–R 8K each", "Feels like R 800K sitting on the table"
  if (issues.length < 5) {
    body.split('\n').forEach(line => {
      const l = line.trim();
      if (l.length < 20 || /^[-•]/.test(l) || !narrativeStartRe.test(l)) return;
      const val = extractIssueVal(l);
      if (!val) return;
      let name = '';
      if      (/missed?\s*call|call.*miss|unanswer|no\s*answer|miss.*job/i.test(l))       name = 'Missed inbound calls -- jobs going to competitors';
      else if (/sitting.on|on.the.table|unrealis|opportunit.gap|left.on/i.test(l))        name = 'Unrealised revenue -- identified opportunity gap';
      else if (/overquot|underquot|pric.*wrong|wrong.*pric|quot.*wife|wife.*quot/i.test(l)) name = 'Inconsistent quoting causing revenue loss';
      else if (/late.pay|pay.*late|cash.flow.*tight|outstanding|collection/i.test(l))     name = 'Late payments impacting cash flow';
      else if (/compet|respond.*fast|fast.*respond|loses.*job|losing.*bid/i.test(l))       name = 'Losing jobs to faster-responding competitors';
      else if (/no\s+website|no\s+online|whatsapp.*schedule|schedule.*whatsapp/i.test(l)) name = 'No digital presence -- missing inbound leads';
      else if (/can.*find.*staff|find.*plumb|recruit|staffing/i.test(l))                  name = 'Difficulty recruiting skilled staff';
      else return; // can't infer a clean name -- skip
      if (issues.some(x => x.name.slice(0,25) === name.slice(0,25))) return;
      issues.push({ name, detail: '', val, sev: issueSev(name), from: '' });
    });
  }

  // Strategy 1.7: colon-separated issue lists from note-style transcripts
  // e.g. "Main problems he mentioned: can't find staff, cash flow tight, manual quoting"
  if (issues.length < 4) {
    const colonListRe = /(?:problems?|issues?|challenges?|pain\s*points?|mentioned|says?)\s*:?\s*([^\n]{20,})/gi;
    let clm;
    while ((clm = colonListRe.exec(body)) !== null) {
      clm[1].split(/[,;]/).forEach(item => {
        item = item.trim().replace(/[.,]$/, '');
        if (item.length < 10 || item.length > 90) return;
        // Only useful if it describes a real problem
        if (!/can.?t|no |never |manual|late|slow|miss|over|under|not |too /i.test(item)) return;
        const name = cleanIssueName(item.replace(/^(?:he\s+)?(?:said\s+)?(?:there.?s\s+)?/i, ''));
        if (name.length < 8) return;
        const val = extractIssueVal(item);
        if (issues.some(x => x.name.slice(0,20) === name.slice(0,20))) return;
        issues.push({ name, detail: '', val, sev: issueSev(name), from: '' });
      });
    }
  }

  // Strategy 2: keyword fallback
  if (issues.length < 2) {
    const kwRe = /bottleneck|delay|problem|issue|broken|manual|inefficien|no system|not tracked|wast|overdue/i;
    const dlRe2 = /^[A-Za-z][a-zA-Z .'-]{1,40}:/;
    body.split('\n').forEach(line => {
      const l = line.trim();
      if (narrativeStartRe.test(l)) return; // skip narrative starters here too
      if (l.length > 35 && kwRe.test(l) && !dlRe2.test(l) && !l.startsWith('-')) {
        const val = extractIssueVal(l);
        const name = cleanIssueName(l.slice(0, 80));
        if (name.length < 8) return;
        issues.push({ name, detail: '', val, sev: 'medium', from: '' });
      }
    });
  }

  // ── Extract quotes -- supports lowercase names, capitalises output ──
  const titlePrefixes = /^(founder|md|ceo|director|owner|operations manager|finance admin|site manager|manager|admin|head of|vp|cfo|coo|hr|project manager|procurement|accountant)\s+/i;
  const skipNames = /^(note|key|total|summary|issues?|section|step|the|this|that|a|an|and|or|but|if|so|main|said|probl|challeng|mention|action|activity|activit|things?|re:?|update|follow|regarding|what|how|why|when|where)$/i;
  // Words that appear in note headers / financial summaries but never in real names
  const notNameWords = /\b(he\b|she\b|his\b|her\b|main\b|probl|issues?\b|mention|activ|wasters?\b|identified\b|section|challeng|summ|said\b|things?\b|what\b|how\b|why\b|when\b|update\b|action\b|following\b|re:\b|revenue\b|programme\b|program\b|channel\b|delivery\b|loyalty\b|pricing\b|rough\b|total\b|cost\b|estimate\b|breakdown\b|financial\b|opportunit|budget\b|margin\b|profit\b|found\b)\b/i;
  const dialogueRe = /^([A-Za-z][a-zA-Z .'-]{1,40}):\s*["']?(.{20,})/gm;
  const quotes = [];
  const usedTexts = new Set();

  while ((m = dialogueRe.exec(body)) !== null) {
    let rawName = m[1].trim();
    if (skipNames.test(rawName)) continue;
    // Reject note-style headers: >3 words, or contains non-name vocabulary
    if (rawName.split(/\s+/).length > 3) continue;
    if (notNameWords.test(rawName)) continue;
    const text = m[2].replace(/["']/g, '').trim();
    // Skip financial summary lines -- content starting with R value signals a section, not a person
    if (/^\s*R\s*\d/.test(text)) continue;
    if (text.length > 20 && !usedTexts.has(text.slice(0,30))) {
      usedTexts.add(text.slice(0,30));
      let role = '';
      const titleMatch = rawName.match(titlePrefixes);
      if (titleMatch) { role = titleMatch[0].trim(); rawName = rawName.slice(titleMatch[0].length).trim(); }
      // Capitalise name
      rawName = rawName.replace(/\b\w/g, c => c.toUpperCase());
      const isFounder = founderNames.has(rawName.toLowerCase())
        || founderNames.has(m[1].trim().toLowerCase())
        || /founder|md|ceo|director|owner/i.test(role)
        || /founder|md|ceo|director|owner/i.test(rawName);
      quotes.push({ text, name: rawName, role, session: isFounder ? 'founder' : 'team' });
    }
  }
  // Strategy 2: quoted strings
  if (quotes.length < 2) {
    const quotedRe = /["""]((?:[^"""]{25,}))["""]/g;
    while ((m = quotedRe.exec(body)) !== null) {
      const text = m[1].trim();
      if (!usedTexts.has(text.slice(0,30))) { usedTexts.add(text.slice(0,30)); quotes.push({ text, name: '', role: '', session: 'team' }); }
    }
  }
  // Strategy 3: paragraph fallback
  if (quotes.length < 2) {
    body.split(/\n{2,}/).forEach(para => {
      const p = para.trim();
      if (p.length > 40 && !usedTexts.has(p.slice(0,30))) { usedTexts.add(p.slice(0,30)); quotes.push({ text: p, name: '', role: '', session: 'team' }); }
    });
  }

  // ── Revenue -- handles "R XM", "X million", "roughly X million" ──
  // IMPORTANT: put longer alternatives before shorter ones (million before M, thousand before k)
  // to prevent "R 22 million" matching as "R 22 m" via the single-char M alternative
  const randRe = /R\s?([\d\s,.]+(?:million|thousand|k|K|m|M)?)/g;
  const rands = [];
  while ((m = randRe.exec(body)) !== null) rands.push('R ' + m[1].trim());

  const revenue = (() => {
    // Tier 1: explicit "revenue/turnover R X"
    const m1 = intro.match(/(?:revenue|turnover)[^R\d]*(R\s*[\d.]+\s*(?:million|thousand|M|k|K)?)/i)
      || body.match(/(R\s*[\d.]+\s*(?:million|M))\s*(?:per year|annual|revenue)/i);
    if (m1) return m1[1].trim();
    // Tier 2a: range "X to Y million" or "X-Y million" -- use higher end
    const m2r = intro.match(/(\d+(?:\.\d+)?)\s*(?:to|-)\s*(\d+(?:\.\d+)?)\s*million/i)
      || body.match(/(\d+(?:\.\d+)?)\s*(?:to|-)\s*(\d+(?:\.\d+)?)\s*million/i);
    if (m2r) return 'R ' + m2r[2] + 'M';
    // Tier 2b: single "X million" with optional qualifier word (probably, about, roughly…)
    const m2 = intro.match(/(?:probably|roughly|about|approximately|around|nearly|maybe|roughly)?\s*([\d]+\.?\d*)\s*million/i)
      || body.match(/([\d]+\.?\d*)\s*million\s*(?:a year|per year|rand|ZAR)/i);
    if (m2) return 'R ' + m2[1] + 'M';
    return rands[0] || '';
  })();

  // ── Headcount ──
  const hcMatch = body.match(/(\d+)\s*(?:staff|employees|people|team members|fulltime|full.time|on the books)/i);
  const headcount = hcMatch ? hcMatch[1] + ' Staff' : '';

  // ── Location ──
  const locMatch = body.match(/\b(Cape Town|Johannesburg|Durban|Pretoria|Port Elizabeth|Sandton|Stellenbosch|Paarl|George|East London|Bloemfontein|Midrand|Randburg|Centurion)\b/i);
  const location = locMatch ? locMatch[1] : '';

  // ── Date ──
  const dateMatch = body.match(/\b(January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{4}\b/i);
  const date = dateMatch ? dateMatch[0] : new Date().toLocaleDateString('en-ZA', { month: 'long', year: 'numeric' });

  // ── Years in business ──
  let years = '';
  const yM1 = body.match(/(\d+)\s*years?\s+(?:in business|running|operating|old|established|in (?:financial|the|this) (?:industry|space|market|sector|game))/i);
  const yM2 = body.match(/(?:been|running|open|in business|established|operating|exist(?:ed|ing))\s+(?:for\s+)?(\d+)\s*years?/i);
  const yM3 = body.match(/(?:founded|started|opened|built|launched|started up)\s+(?:the (?:business|company|firm|practice))?\s*(?:in|around|back in|circa)?\s*((?:19|20)\d{2})/i);
  const yM4 = body.match(/(\d+)[- ]year[- ](?:old|established)/i);
  if      (yM1) { years = yM1[1] + ' Years'; }
  else if (yM2) { years = yM2[1] + ' Years'; }
  else if (yM3) { const yrsSince = new Date().getFullYear() - parseInt(yM3[1]); if (yrsSince > 0 && yrsSince < 80) years = yrsSince + ' Years'; }
  else if (yM4) { years = yM4[1] + ' Years'; }

  // ── Time-wasting activities ──
  const activities = [];
  const usedActKeys = new Set();
  const skipActRe = /^(total|revenue|cost|r\s?\d|the\b|we\b|i\b|our\b|it\b|that\b|this\b|there\b|those\b)/i;

  function tryAddAct(label, hrs) {
    label = label.trim().replace(/\s+/g, ' ').replace(/[.,;:–-]$/, '');
    hrs   = parseFloat(hrs);
    if (hrs < 1 || hrs > 80 || label.length < 3 || label.length > 40) return;
    if (skipActRe.test(label)) return;
    const key = label.toLowerCase().slice(0, 14);
    if (!usedActKeys.has(key) && activities.length < 6) {
      usedActKeys.add(key);
      activities.push({ label: label.charAt(0).toUpperCase() + label.slice(1), hours: String(hrs) });
    }
  }

  // Strategy A: "Label -- N hours" / "Label: N hrs/week" (structured bullet or inline)
  const actA = /(?:^|[-•])\s*([A-Za-z][A-Za-z\s\-\/&']{2,30}?)\s*[:\-–]+\s*(\d+(?:\.\d+)?)\s*h(?:ours?|rs?)?\s*(?:\/?\s*(?:a\s+)?week|per\s+week|weekly)?/gim;
  let actM;
  while ((actM = actA.exec(body)) !== null) tryAddAct(actM[1], actM[2]);

  // Strategy B: "N hours [a/per] week on/for/doing Label"
  const actB = /(\d+(?:\.\d+)?)\s*h(?:ours?|rs?)?(?:\s*(?:a|per|\/)\s*week)?\s+(?:on|for|doing|to handle|chasing|managing|in|of|just for)\s+([A-Za-z][A-Za-z\s\-\/&']{3,35}?)(?=[,.\n–;]|$)/gi;
  while ((actM = actB.exec(body)) !== null) tryAddAct(actM[2], actM[1]);

  // Strategy C: "Label takes/consumes/costs N hours [a week]"
  const actC = /([A-Za-z][A-Za-z\s\-\/&']{2,30}?)\s+(?:takes?|consumes?|costs?|requires?|is)\s+(?:about\s+|approximately\s+|around\s+|easily\s+|roughly\s+)?(\d+(?:\.\d+)?)\s*h(?:ours?|rs?)?(?:\s*(?:a|per|\/)\s*week)?/gi;
  while ((actM = actC.exec(body)) !== null) tryAddAct(actM[1], actM[2]);

  // Strategy D: "spend N hours [a week] on Label"
  const actD = /spend(?:ing)?\s+(?:about\s+|roughly\s+|around\s+|easily\s+)?(\d+(?:\.\d+)?)\s*h(?:ours?|rs?)?(?:\s*(?:a|per|\/)\s*week|\s*a week)?\s+(?:on|for|doing|just on|in)?\s+([A-Za-z][A-Za-z\s\-\/&']{3,35}?)(?=[,.\n–;]|$)/gi;
  while ((actM = actD.exec(body)) !== null) tryAddAct(actM[2], actM[1]);

  activities.sort((a, b) => parseFloat(b.hours) - parseFloat(a.hours));

  // ── Financial totals from issues ──
  const cats = { td: 0, ml: 0, rg: 0, sf: 0 };
  issues.forEach(issue => {
    const val = parseRandNum(issue.val);
    const cat = detectCat(issue.name);
    if (cat === 'Tech Debt')      cats.td += val;
    else if (cat === 'Money Leak') cats.ml += val;
    else if (cat === 'Revenue Gap') cats.rg += val;
    else                           cats.sf += val;
  });

  // Try to read explicit total from transcript -- handles various phrasings
  const totalLineMatch =
    body.match(/total\s+value\s+at\s+stake[^R\n]*(R[\d\s,.]+)/i) ||
    body.match(/(?:rough|estimated|approx\.?)\s+total[^R\n]*[:\-–]?\s*(R[\d\s,.]+)/i) ||
    body.match(/total\s+opportunit[^R\n]*(R[\d\s,.]+)/i) ||
    body.match(/total[^R\n]{0,30}(R[\d\s,.]+\s*(?:to|-)\s*R[\d\s,.]+)/i); // range total
  const totalNum = totalLineMatch
    ? parseRandNum(totalLineMatch[1])
    : Object.values(cats).reduce((s, v) => s + v, 0);

  // ── Retainer estimate ──
  const retainerCost  = Math.round(totalNum * 0.45);
  const roiMultiple   = retainerCost ? Math.round(totalNum / retainerCost) + '×' : '';
  const retVal        = fmtR(Math.round(totalNum * 0.5));

  // ── Auto-generate roadmap from issues ──
  const roadmap = issues.slice(0, 8).map(issue => {
    const cat    = detectCat(issue.name);
    const effort = issue.sev === 'critical' ? 'Low'
                 : issue.sev === 'high'     ? 'Medium'
                 :                            'Medium';
    const tl     = effort === 'Low' ? '1–2 weeks' : effort === 'Medium' ? '2–4 weeks' : '4–8 weeks';
    const valNum = parseRandNum(issue.val);
    return {
      name:     issueToFix(issue.name),
      cat,
      effort,
      val:      issue.val.replace(/\s*\/\s*yr/i, '').trim(),
      valNum,
      timeline: tl
    };
  }).sort((a, b) => b.valNum - a.valNum); // highest value first

  // ── Build prefill ──
  const prefill = {
    name: clientName, revenue, founder: founderName, founderTitle,
    headcount, years, location, date,
    totalNum,
    totalDisplay: fmtR(totalNum),
    td: cats.td ? fmtR(cats.td) : '',
    ml: cats.ml ? fmtR(cats.ml) : '',
    rg: cats.rg ? fmtR(cats.rg) : '',
    sf: cats.sf ? fmtR(cats.sf) : '',
    activities: activities.slice(0, 6),
    quotes:  quotes.slice(0, 8),
    issues:  issues.slice(0, 8),
    roadmap,
    roi:      roiMultiple,
    retVal,
    retFixes: issues.length + ' fixes',
    retCon:   fmtR(retainerCost)
  };

  // ── Switch to audits, fill form, then save once ──
  switchTab('audits');
  auActiveId = null;
  renderAuditList();
  renderAuditForm(prefill); // fills all fields synchronously via loadAuditFormFields inside
  document.getElementById('audit-form-wrap')?.scrollIntoView({ block: 'start' });

  // Single save -- saveAuditDraft reads from the now-populated DOM and creates one doc
  saveAuditDraft().then(() => {
    showToast('Audit saved', 'ok');
  }).catch(err => {
    console.warn('Audit auto-save failed:', err);
    showToast('Could not save audit -- check connection', 'warn');
  });
}

// ══════════════════════════════════════════════════════════
//  UTILITIES
// ══════════════════════════════════════════════════════════

function showToast(msg, type = 'info') {
  const existing = document.getElementById('ev-toast');
  if (existing) { clearTimeout(existing._hideTimer); existing.remove(); }
  const t = document.createElement('div');
  t.id = 'ev-toast';
  t.className = 'ev-toast ev-toast-' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('ev-toast-show')));
  t._hideTimer = setTimeout(() => {
    t.classList.remove('ev-toast-show');
    setTimeout(() => { if (t.parentNode) t.remove(); }, 300);
  }, 3200);
}

function escH(s)    { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s||'').replace(/"/g,'&quot;'); }

function relDate(val) {
  if (!val) return '';
  const d = val.toDate ? val.toDate() : new Date(val);
  const diff = (Date.now() - d) / 1000;
  if (diff < 60)    return 'just now';
  if (diff < 3600)  return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return d.toLocaleDateString('en-ZA', {day:'numeric', month:'short'});
}
function longDate(val) {
  if (!val) return '';
  const d = val.toDate ? val.toDate() : new Date(val);
  return d.toLocaleDateString('en-ZA', {day:'numeric', month:'long', year:'numeric'});
}

// Keyboard shortcut: Cmd+N for new writing entry
document.addEventListener('keydown', e => {
  if ((e.metaKey||e.ctrlKey) && e.key === 'n') {
    const wrActive = document.getElementById('section-writing').classList.contains('active');
    if (wrActive) { e.preventDefault(); newWritingEntry(); }
  }
});
