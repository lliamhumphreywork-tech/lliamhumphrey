<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>evverywhere workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
/* ── Reset & Variables ─────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream:  #F4F2EF; --cream-2: #ECEAE7; --cream-3: #E3E1DD;
  --ink:    #111111; --ink-2:   #1E1E1E; --muted:   #8F8F8F;
  --line:   #DDDBD8; --red:     #BF3E28;
  --serif:  'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --mono:   'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --nav-h:  52px;
  --sidebar:280px;
}
html, body { height: 100%; background: var(--cream); color: var(--ink); font-family: var(--mono); }
input, textarea, select, button { font-family: inherit; }

/* ── Login Screen ──────────────────────────────────────── */
#screen-login {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: var(--ink);
}
.login-box { text-align: center; max-width: 420px; padding: 0 24px; }
.login-logo {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em;
  text-transform: lowercase; color: rgba(234,227,217,.4); margin-bottom: 64px;
}
.login-logo em { font-style: italic; font-family: var(--serif); font-size: 14px; }
.login-heading {
  font-family: var(--serif); font-size: clamp(48px,8vw,80px); font-weight: 300;
  font-style: italic; line-height: .95; color: var(--cream); margin-bottom: 20px;
}
.login-sub {
  font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  color: rgba(234,227,217,.35); margin-bottom: 56px; line-height: 2;
}
.btn-google {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--cream); border: none; width: 100%;
  padding: 14px 24px; cursor: pointer;
  font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink);
  font-family: inherit; transition: opacity 0.15s;
}
.btn-google:hover { opacity: 0.88; }
.btn-google:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-google svg { flex-shrink: 0; }
.login-error {
  margin-top: 16px; font-size: 10px; letter-spacing: 0.12em;
  color: #e06060; text-transform: uppercase; line-height: 1.5;
}

/* ── Main App ──────────────────────────────────────────── */
#screen-app { display: none; height: 100vh; flex-direction: column; }
#screen-app.visible { display: flex; }

/* ── Top Navigation ────────────────────────────────────── */
#main-nav {
  height: var(--nav-h); flex-shrink: 0;
  background: var(--ink); color: var(--cream);
  display: flex; align-items: center; padding: 0 24px; gap: 0;
  border-bottom: 1px solid rgba(234,227,217,.08);
  position: relative; z-index: 200;
}
.nav-brand {
  font-size: 10px; letter-spacing: 0.12em; text-transform: lowercase; color: rgba(234,227,217,.7);
  margin-right: 32px; white-space: nowrap;
}
.nav-brand em { font-style: italic; font-family: var(--serif); font-size: 13px; color: var(--cream); }
.nav-tabs { display: flex; gap: 0; }
.nav-tab {
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: rgba(234,227,217,.35); padding: 0 20px; height: var(--nav-h);
  display: flex; align-items: center; cursor: pointer; border: none;
  background: transparent; transition: color 0.15s;
  border-bottom: 2px solid transparent; position: relative; top: 1px;
}
.nav-tab:hover { color: rgba(234,227,217,.7); }
.nav-tab.active { color: var(--cream); border-bottom-color: var(--cream); }
.nav-spacer { flex: 1; }
.nav-user {
  display: flex; align-items: center; gap: 10px; margin-right: 16px;
}
.nav-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(234,227,217,.15); overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
.nav-avatar-initial {
  font-size: 11px; letter-spacing: 0; color: var(--cream); font-weight: 600;
}
.nav-name { font-size: 11px; letter-spacing: 0.1em; color: rgba(255,255,255,.5); }
.btn-signout {
  font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  background: transparent; border: 1px solid rgba(234,227,217,.15);
  color: rgba(234,227,217,.4); padding: 5px 12px; cursor: pointer;
  transition: all 0.15s;
}
.btn-signout:hover { border-color: rgba(234,227,217,.4); color: rgba(234,227,217,.7); }

/* ── Section shell ─────────────────────────────────────── */
.main-section {
  flex: 1; display: none; overflow: hidden;
  height: calc(100vh - var(--nav-h));
}
.main-section.active { display: flex; }

/* ═══════════════════════════════════════════════════════ */
/*  WRITING SECTION                                        */
/* ═══════════════════════════════════════════════════════ */
#section-writing { background: var(--cream); }

.wr-sidebar {
  width: var(--sidebar); flex-shrink: 0;
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--cream-2);
}
.wr-sidebar-hdr {
  padding: 16px 16px 12px; border-bottom: 1px solid var(--line); flex-shrink: 0;
}
.wr-lbl { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
.wr-count { font-family: var(--serif); font-size: 32px; font-weight: 300; color: var(--ink); line-height: 1; margin-top: 4px; }
.wr-count-sub { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.wr-search { padding: 10px 12px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.wr-search input {
  width: 100%; background: transparent; border: 1px solid var(--line);
  padding: 6px 10px; font-size: 10px; color: var(--ink); outline: none;
}
.wr-search input::placeholder { color: var(--muted); }
.wr-search input:focus { border-color: var(--ink); }
.wr-list { flex: 1; overflow-y: auto; }

.wr-item {
  padding: 10px 16px; cursor: pointer; border-left: 2px solid transparent;
  border-bottom: 1px solid rgba(206,198,186,.4); transition: background 0.1s;
}
.wr-item:hover { background: rgba(206,198,186,.4); }
.wr-item.active { background: var(--cream); border-left-color: var(--ink); }
.wr-item-title {
  font-family: var(--serif); font-size: 14px; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3;
}
.wr-item-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.wr-tag {
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  padding: 2px 5px; border: 1px solid var(--line); color: var(--muted);
}
.wr-tag.transcript { border-color: #8A7F73; color: #8A7F73; }
.wr-tag.copy       { border-color: var(--red); color: var(--red); }
.wr-tag.notes      { border-color: var(--ink); color: var(--ink-2); }
.wr-tag.ideas      { border-color: #6B8F71; color: #6B8F71; }
.wr-item-date { font-size: 10px; color: var(--muted); }
.wr-item-preview { font-size: 11px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wr-author { font-size: 10px; color: rgba(138,127,115,.6); margin-top: 2px; }

.wr-empty { padding: 40px 16px; text-align: center; }
.wr-empty p { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); line-height: 2; }

.wr-editor-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.wr-ed-bar {
  border-bottom: 1px solid var(--line); padding: 10px 24px;
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
.wr-ed-title {
  flex: 1; font-family: var(--serif); font-size: 20px; font-weight: 300;
  font-style: italic; background: transparent; border: none; color: var(--ink); outline: none;
}
.wr-ed-title::placeholder { color: var(--muted); }
.wr-tag-btns { display: flex; gap: 4px; }
.wr-tag-btn {
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  padding: 3px 7px; border: 1px solid var(--line); background: transparent;
  color: var(--muted); cursor: pointer; transition: all 0.1s;
}
.wr-tag-btn:hover { border-color: var(--ink-2); color: var(--ink); }
.wr-tag-btn.active-transcript { border-color: #8A7F73; color: #8A7F73; background: rgba(138,127,115,.06); }
.wr-tag-btn.active-copy       { border-color: var(--red); color: var(--red); background: rgba(191,62,40,.05); }
.wr-tag-btn.active-notes      { border-color: var(--ink); color: var(--ink); background: rgba(26,22,18,.05); }
.wr-tag-btn.active-ideas      { border-color: #6B8F71; color: #6B8F71; background: rgba(107,143,113,.06); }
.wr-btn-clip, .wr-btn-del, .wr-btn-audit {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  background: transparent; border: 1px solid var(--line); color: var(--muted);
  padding: 4px 10px; cursor: pointer; transition: all 0.15s;
}
.wr-btn-clip:hover  { border-color: var(--ink); color: var(--ink); }
.wr-btn-del:hover   { border-color: var(--red); color: var(--red); }
.wr-btn-audit       { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.wr-btn-audit:hover { opacity: 0.82; }
.wr-ed-body { flex: 1; overflow-y: auto; padding: 36px 72px 60px; }
.wr-textarea {
  width: 100%; min-height: 100%; background: transparent; border: none;
  font-size: 13px; line-height: 1.9; color: var(--ink); outline: none;
  resize: none; caret-color: var(--red);
}
.wr-textarea::placeholder { color: rgba(138,127,115,.4); }
.wr-ed-footer {
  border-top: 1px solid var(--line); padding: 7px 24px;
  display: flex; gap: 24px; align-items: center; background: var(--cream-2); flex-shrink: 0;
}
.wr-btn-new-foot {
  margin-left: auto; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  background: var(--ink); color: var(--cream); border: none;
  padding: 5px 14px; cursor: pointer; transition: opacity 0.15s; flex-shrink: 0;
}
.wr-btn-new-foot:hover { opacity: 0.82; }
.wr-stat { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.wr-stat span { color: var(--ink); }
.wr-no-entry {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 12px;
}
.wr-no-entry-h { font-family: var(--serif); font-size: 52px; font-weight: 300; font-style: italic; color: var(--line); }
.wr-no-entry-s { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.wr-btn-start {
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  background: var(--ink); color: var(--cream); border: none;
  padding: 10px 24px; cursor: pointer; margin-top: 8px; transition: opacity 0.15s;
}
.wr-btn-start:hover { opacity: 0.82; }

/* ═══════════════════════════════════════════════════════ */
/*  AUDITS SECTION                                         */
/* ═══════════════════════════════════════════════════════ */
#section-audits { background: var(--cream); }

.au-sidebar {
  width: var(--sidebar); flex-shrink: 0; border-right: 1px solid var(--line);
  display: flex; flex-direction: column; overflow: hidden; background: var(--cream-2);
}
.au-sidebar-hdr {
  padding: 16px 16px 12px; border-bottom: 1px solid var(--line); flex-shrink: 0;
}
.au-lbl { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.btn-new-audit {
  width: 100%; background: var(--ink); color: var(--cream); border: none;
  padding: 9px; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  cursor: pointer; transition: opacity 0.15s;
}
.btn-new-audit:hover { opacity: 0.82; }
.au-list { flex: 1; overflow-y: auto; }
.au-item {
  padding: 12px 16px; cursor: pointer; border-left: 2px solid transparent;
  border-bottom: 1px solid rgba(206,198,186,.4); transition: background 0.1s;
}
.au-item:hover { background: rgba(206,198,186,.4); }
.au-item.active { background: var(--cream); border-left-color: var(--ink); }
.au-item-name { font-family: var(--serif); font-size: 15px; color: var(--ink); line-height: 1.2; }
.au-item-meta { font-size: 10px; color: var(--muted); margin-top: 4px; letter-spacing: 0.08em; }
.au-item-value { font-size: 11px; color: var(--red); margin-top: 3px; }

.au-main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; min-width: 0; }

/* Audit empty */
.au-empty {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 12px;
}
.au-empty-h { font-family: var(--serif); font-size: 52px; font-weight: 300; font-style: italic; color: var(--line); }
.au-empty-s { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }

/* ═══════════════════════════════════════════════════════ */
/*  AUDIT FORM (scoped to #audit-form-wrap)               */
/* ═══════════════════════════════════════════════════════ */
#audit-form-wrap {
  flex: 1; overflow-y: auto; padding: 40px 60px 120px;
  background: var(--cream);
}
#audit-form-wrap .form-hdr { margin-bottom: 56px; }
#audit-form-wrap .form-headline {
  font-family: var(--serif); font-size: clamp(40px,5vw,64px);
  font-weight: 300; font-style: italic; line-height: .95; color: var(--ink);
}
#audit-form-wrap .form-subtitle {
  font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--muted); margin-top: 16px; line-height: 2.2;
}
#audit-form-wrap .form-section { margin-bottom: 52px; }
#audit-form-wrap .section-label {
  display: flex; align-items: baseline; gap: 16px; margin-bottom: 24px;
  padding-bottom: 10px; border-bottom: 1px solid var(--line);
}
#audit-form-wrap .section-num {
  font-size: 11px; letter-spacing: 0.18em; color: var(--muted);
}
#audit-form-wrap .section-title {
  font-family: var(--serif); font-size: 22px; font-weight: 400; color: var(--ink);
}
#audit-form-wrap .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 32px; }
#audit-form-wrap .field-full { grid-column: 1/-1; }
#audit-form-wrap .field { display: flex; flex-direction: column; gap: 6px; }
#audit-form-wrap label {
  font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
}
#audit-form-wrap input[type=text],
#audit-form-wrap input[type=number],
#audit-form-wrap textarea,
#audit-form-wrap select {
  background: transparent; border: none; border-bottom: 1px solid var(--line);
  padding: 8px 0; font-family: var(--serif); font-size: 17px;
  color: var(--ink); outline: none; width: 100%; transition: border-color 0.2s;
}
#audit-form-wrap input:focus, #audit-form-wrap textarea:focus, #audit-form-wrap select:focus {
  border-bottom-color: var(--ink);
}
#audit-form-wrap textarea { resize: vertical; min-height: 72px; }
#audit-form-wrap select { cursor: pointer; }

/* Dynamic rows */
#audit-form-wrap .dyn-row {
  display: grid; gap: 12px; padding: 16px;
  border: 1px solid var(--line); margin-bottom: 10px; position: relative;
}
#audit-form-wrap .dyn-row .btn-remove {
  position: absolute; top: 10px; right: 10px;
  background: transparent; border: none; color: var(--muted); cursor: pointer;
  font-size: 16px; line-height: 1; padding: 2px 6px; transition: color 0.15s;
}
#audit-form-wrap .dyn-row .btn-remove:hover { color: var(--red); }
#audit-form-wrap .btn-add {
  background: transparent; border: 1px solid var(--line); color: var(--muted);
  padding: 8px 16px; font-size: 11px; letter-spacing: 0.14em;
  text-transform: uppercase; cursor: pointer; transition: all 0.15s; margin-top: 8px;
}
#audit-form-wrap .btn-add:hover { border-color: var(--ink); color: var(--ink); }

/* Form top bar */
.form-top-bar {
  background: var(--cream); border-bottom: 1px solid var(--line);
  padding: 10px 60px; display: flex; align-items: center; justify-content: space-between;
}
.form-top-label {
  font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
}
.btn-see-dashboard {
  background: var(--red); color: var(--cream); border: none;
  padding: 8px 22px; font-size: 11px; letter-spacing: 0.18em;
  text-transform: uppercase; cursor: pointer; transition: opacity 0.15s;
}
.btn-see-dashboard:hover { opacity: 0.85; }

/* Sidebar dashboard button */
.au-dash-btn {
  display: block; width: 100%; margin-top: 7px;
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  background: transparent; border: 1px solid var(--line);
  color: var(--muted); padding: 4px 8px; cursor: pointer; text-align: left;
  transition: all 0.15s;
}
.au-dash-btn:hover { border-color: var(--red); color: var(--red); }

/* Form action bar */
.form-actions {
  position: fixed; bottom: 0; right: 0;
  background: var(--cream-2); border-top: 1px solid var(--line);
  padding: 12px 24px; display: flex; align-items: center; gap: 16px;
  z-index: 100;
}
.form-action-info {
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
}
.btn-save-audit {
  background: transparent; border: 1px solid var(--line);
  color: var(--muted); padding: 9px 20px;
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  cursor: pointer; transition: all 0.15s;
}
.btn-save-audit:hover { border-color: var(--ink); color: var(--ink); }
.btn-generate {
  background: var(--ink); color: var(--cream); border: none;
  padding: 10px 28px; font-size: 11px; letter-spacing: 0.18em;
  text-transform: uppercase; cursor: pointer; transition: opacity 0.15s;
}
.btn-generate:hover { opacity: 0.82; }

/* ═══════════════════════════════════════════════════════ */
/*  AUDIT DASHBOARD (scoped to #ds)                        */
/* ═══════════════════════════════════════════════════════ */
#ds { background: var(--cream); }
#ds *,#ds *::before,#ds *::after { box-sizing: border-box; }

/* Nav */
#ds .ds-nav {
  position: sticky; top: 0; z-index: 100; background: var(--cream);
  border-bottom: 1px solid var(--line); height: 48px;
  display: flex; align-items: center; padding: 0 24px; gap: 0;
}
#ds .ds-nav-brand { font-size: 10px; letter-spacing: .1em; text-transform: lowercase; color: var(--muted); margin-right: 24px; }
#ds .ds-nav-brand em { font-style: italic; font-family: var(--serif); font-size: 12px; color: var(--ink); }
#ds .ds-nav-links { display: flex; }
#ds .ds-nav-links a {
  font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
  text-decoration: none; padding: 0 14px; height: 48px; display: flex; align-items: center;
  transition: color .15s;
}
#ds .ds-nav-links a:hover { color: var(--ink); }
#ds .ds-spacer { flex: 1; }
#ds .ds-nav-cta {
  background: var(--ink); color: var(--cream); border: none;
  padding: 7px 18px; font-size: 10px; letter-spacing: .18em;
  text-transform: uppercase; cursor: pointer; transition: opacity .15s;
}
#ds .ds-nav-cta:hover { opacity: .82; }
#ds .btn-back-edit {
  background: transparent; border: 1px solid var(--line); color: var(--muted);
  padding: 6px 14px; font-size: 10px; letter-spacing: .16em;
  text-transform: uppercase; cursor: pointer; margin-right: 10px;
  transition: all .15s;
}
#ds .btn-back-edit:hover { border-color: var(--ink); color: var(--ink); }

/* Info bar */
#ds .info-bar {
  border-bottom: 1px solid var(--line); padding: 10px 32px;
  display: flex; align-items: center; font-size: 11px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted); gap: 0;
}
#ds .info-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--red); margin-right: 10px;
}
#ds .info-sep { margin: 0 10px; opacity: .4; }
#ds .info-spacer { flex: 1; }

/* Hero */
#ds .hero { padding: 80px 40px 60px; }
#ds .hero-eyebrow {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 40px;
}
#ds .hero-label {
  font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); line-height: 2;
}
#ds .hero-prep { text-align: right; }
#ds .hero-prep-lbl { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
#ds .hero-prep-val { font-family: var(--serif); font-size: 16px; font-weight: 400; color: var(--ink); margin-top: 4px; }
#ds .hero-h { font-family: var(--serif); font-size: clamp(40px,6vw,84px); font-weight: 300; line-height: .95; color: var(--ink); }
#ds .hero-h em { font-style: italic; }
#ds .client-row {
  display: grid; grid-template-columns: repeat(4,1fr); border-top: 1px solid var(--line); margin-top: 56px;
}
#ds .client-cell { padding: 20px 0; border-right: 1px solid var(--line); padding-right: 24px; }
#ds .client-cell:last-child { border-right: none; }
#ds .client-cell + .client-cell { padding-left: 24px; }
#ds .cl-lbl { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
#ds .cl-val { font-family: var(--serif); font-size: 22px; font-weight: 300; color: var(--ink); }

/* Value hero */
#ds .val-hero { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 56px 40px; }
#ds .val-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 32px; }
#ds .val-lbl { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
#ds .val-eyebrow { text-align: right; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); line-height: 2; }
#ds .val-counter { font-family: var(--serif); font-size: clamp(56px,10vw,120px); font-weight: 300; line-height: .9; color: var(--ink); letter-spacing: -.02em; }
#ds .val-sub { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 14px; }
#ds .val-cats {
  display: grid; grid-template-columns: repeat(4,1fr); gap: 0; margin-top: 32px;
  border-top: 1px solid var(--line);
}
#ds .val-cat { padding: 20px 0; border-right: 1px solid var(--line); padding-right: 20px; }
#ds .val-cat:last-child { border-right: none; }
#ds .val-cat + .val-cat { padding-left: 20px; }
#ds .vc-lbl { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
#ds .vc-val { font-family: var(--serif); font-size: 26px; font-weight: 300; color: var(--red); }

/* Timeline */
#ds .tl-section { border-bottom: 1px solid var(--line); padding: 36px 40px; }
#ds .tl-label { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 20px; display: flex; justify-content: space-between; }
#ds .tl-steps { display: grid; grid-template-columns: repeat(6,1fr); gap: 0; }
#ds .tl-step { padding: 16px; border: 1px solid var(--line); margin-right: -1px; }
#ds .tl-step.active { background: var(--ink); border-color: var(--ink); }
#ds .tl-step-num { font-size: 10px; letter-spacing: .14em; color: var(--muted); margin-bottom: 6px; }
#ds .tl-step.active .tl-step-num { color: rgba(234,227,217,.4); }
#ds .tl-step-name { font-family: var(--serif); font-size: 14px; font-weight: 400; color: var(--ink); line-height: 1.2; }
#ds .tl-step.active .tl-step-name { color: var(--cream); }
#ds .tl-step-desc { font-size: 10px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
#ds .tl-step.active .tl-step-desc { color: rgba(234,227,217,.4); }
#ds .tl-step-tag { display: inline-block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; margin-top: 10px; padding: 3px 6px; border: 1px solid var(--line); color: var(--muted); }
#ds .tl-step.active .tl-step-tag { border-color: rgba(234,227,217,.2); color: rgba(234,227,217,.5); }
#ds .tl-live { background: var(--red); border-color: var(--red); color: var(--cream); font-size: 11px; letter-spacing: .14em; padding: 2px 6px; display: inline-block; margin-top: 8px; }

/* Shared section header */
#ds .db-section { border-bottom: 1px solid var(--line); }
#ds .slbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 40px; border-bottom: 1px solid var(--line);
  font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
}
#ds .slbar span { color: var(--ink); }

/* Sessions */
#ds .sessions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 40px; }
#ds .session-hdr { grid-column: 1/-1; margin-bottom: 32px; }
#ds .session-hdr-h { font-family: var(--serif); font-size: clamp(32px,4vw,52px); font-weight: 300; line-height: .95; color: var(--ink); }
#ds .session-hdr-h em { font-style: italic; }
#ds .session-hdr-s { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 12px; }
#ds .quote-card { padding: 24px; border: 1px solid var(--line); margin-bottom: -1px; margin-right: -1px; }
#ds .quote-body { font-family: var(--serif); font-size: 16px; font-weight: 300; font-style: italic; line-height: 1.5; color: var(--ink); }
#ds .quote-attr { margin-top: 12px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
#ds .quote-tag { display: inline-block; margin-top: 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 2px 6px; border: 1px solid var(--line); color: var(--muted); }
#ds .quote-tag.founder { border-color: var(--ink); color: var(--ink-2); }

/* Findings */
#ds .findings-wrap { padding: 40px; }
#ds .findings-hdr-h { font-family: var(--serif); font-size: clamp(32px,4vw,52px); font-weight: 300; line-height: .95; color: var(--ink); margin-bottom: 8px; }
#ds .findings-hdr-h em { font-style: italic; }
#ds .findings-hdr-s { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 28px; }
#ds .findings-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 0; border: 1px solid var(--line); margin-bottom: 32px; }
#ds .fs-cell { padding: 16px 20px; border-right: 1px solid var(--line); }
#ds .fs-cell:last-child { border-right: none; }
#ds .fs-lbl { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
#ds .fs-val { font-family: var(--serif); font-size: 28px; font-weight: 300; color: var(--red); }
#ds .issue-row {
  display: flex; align-items: baseline; gap: 0; padding: 14px 0;
  border-bottom: 1px solid rgba(206,198,186,.5);
}
#ds .issue-num { font-size: 11px; color: var(--muted); width: 32px; flex-shrink: 0; }
#ds .issue-name { font-family: var(--serif); font-size: 16px; font-weight: 300; flex: 1; color: var(--ink); }
#ds .issue-detail { font-size: 10px; color: var(--muted); letter-spacing: .08em; }
#ds .issue-val { font-size: 11px; letter-spacing: .06em; color: var(--red); text-align: right; flex-shrink: 0; width: 120px; }
#ds .issue-sev {
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  padding: 2px 6px; border: 1px solid; margin-left: 12px; flex-shrink: 0;
}
#ds .issue-sev.critical { background: var(--red); color: var(--cream); border-color: var(--red); }
#ds .issue-sev.high { border-color: #C17A3A; color: #C17A3A; }
#ds .issue-sev.medium { border-color: var(--muted); color: var(--muted); }

/* ── Highlighting: most important info ─────────────────── */
#ds .issue-row.issue-top {
  background: rgba(191,62,40,.06);
  border-left: 3px solid var(--red);
  padding-left: 14px; margin-left: -14px;
  border-bottom-color: rgba(191,62,40,.2);
}
#ds .issue-row.issue-top .issue-name { font-size: 19px; font-weight: 400; }
#ds .issue-row.issue-top .issue-val  { font-size: 13px; letter-spacing: .04em; }

#ds .val-cat.dominant .vc-val { font-size: 34px; color: var(--red); }
#ds .val-cat.dominant .vc-lbl { color: var(--red); }
#ds .val-cat.dominant { position: relative; }
#ds .val-cat.dominant::after {
  content: 'HIGHEST'; position: absolute; top: 20px; right: 0;
  font-size: 11px; letter-spacing: .18em; color: rgba(191,62,40,.5);
}

#ds .quick-win {
  background: var(--ink); color: var(--cream);
  padding: 18px 24px; margin-bottom: 28px;
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
}
#ds .qw-label {
  font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
  color: rgba(234,227,217,.35); flex-shrink: 0; white-space: nowrap;
  border: 1px solid rgba(234,227,217,.15); padding: 3px 8px;
}
#ds .qw-name {
  font-family: var(--serif); font-size: 18px; font-weight: 300; font-style: italic;
  color: var(--cream); flex: 1; min-width: 0;
}
#ds .qw-val {
  font-family: var(--serif); font-size: 22px; font-weight: 300;
  color: var(--cream); flex-shrink: 0; white-space: nowrap;
}
#ds .qw-effort {
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  padding: 3px 8px; border: 1px solid rgba(107,143,113,.5);
  color: #6B8F71; flex-shrink: 0;
}

#ds tr.rm-top td { background: rgba(191,62,40,.04); }
#ds tr.rm-top .pt-name { font-weight: 500; }

/* Analysis */
#ds .analysis-wrap { padding: 40px; }
#ds .analysis-h { font-family: var(--serif); font-size: clamp(32px,4vw,52px); font-weight: 300; font-style: italic; line-height: .95; margin-bottom: 8px; }
#ds .analysis-s { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 28px; }
#ds .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-bottom: 36px; }
#ds .chart-cell { }
#ds .chart-lbl { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
#ds .insights-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 28px; }
#ds .insight-card { border: 1px solid var(--line); padding: 16px 20px; }
#ds .insight-tag { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
#ds .insight-body { font-family: var(--serif); font-size: 14px; line-height: 1.5; color: var(--ink); }

/* Roadmap */
#ds .roadmap-wrap { padding: 40px; overflow-x: auto; }
#ds .roadmap-h { font-family: var(--serif); font-size: clamp(32px,4vw,52px); font-weight: 300; line-height: .95; margin-bottom: 8px; }
#ds .roadmap-h em { font-style: italic; }
#ds .roadmap-s { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 24px; }
#ds table { width: 100%; border-collapse: collapse; }
#ds thead tr { border-bottom: 1px solid var(--line); }
#ds th { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding: 8px 12px; text-align: left; }
#ds td { padding: 12px; border-bottom: 1px solid rgba(206,198,186,.4); vertical-align: top; }
#ds .pt-rank { font-size: 11px; color: var(--muted); text-align: center; width: 36px; }
#ds .pt-name { font-family: var(--serif); font-size: 15px; font-weight: 400; color: var(--ink); }
#ds .pt-cat { font-size: 10px; color: var(--muted); margin-top: 2px; }
#ds .pt-effort {
  font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  padding: 2px 6px; border: 1px solid var(--line); white-space: nowrap;
}
#ds .pt-effort.low    { border-color: #6B8F71; color: #6B8F71; }
#ds .pt-effort.medium { border-color: #C17A3A; color: #C17A3A; }
#ds .pt-effort.high   { border-color: var(--red); color: var(--red); }
#ds .pt-value { font-family: var(--serif); font-size: 15px; color: var(--red); white-space: nowrap; }
#ds .pt-timeline { font-size: 11px; color: var(--muted); white-space: nowrap; }
#ds .pt-bar-wrap { height: 3px; background: var(--cream-3); margin-top: 8px; }
#ds .pt-bar { height: 100%; background: var(--red); }

/* Retainer */
#ds .ret-section { background: var(--ink); color: var(--cream); padding: 96px 40px; text-align: center; }
#ds .ret-eyebrow { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: rgba(234,227,217,.3); margin-bottom: 12px; }
#ds .ret-h { font-family: var(--serif); font-size: clamp(28px,4vw,44px); font-weight: 300; color: var(--cream); margin-bottom: 12px; }
#ds .ret-sub { font-size: 10px; letter-spacing: .1em; color: rgba(234,227,217,.4); max-width: 560px; margin: 0 auto 56px; line-height: 1.8; }
#ds .ret-roi-lbl { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: rgba(234,227,217,.3); margin-bottom: 10px; }
#ds .ret-roi-val { font-family: var(--serif); font-size: clamp(80px,14vw,180px); font-weight: 300; line-height: .9; color: var(--cream); letter-spacing: -.03em; }
#ds .ret-roi-sub { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: rgba(234,227,217,.3); margin-top: 12px; margin-bottom: 56px; }
#ds .ret-nums { display: flex; border: 1px solid rgba(234,227,217,.12); max-width: 860px; margin: 0 auto 56px; }
#ds .ret-num-cell { flex: 1; padding: 28px 24px; border-right: 1px solid rgba(234,227,217,.12); }
#ds .ret-num-cell:last-child { border-right: none; }
#ds .ret-num-lbl { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: rgba(234,227,217,.3); margin-bottom: 10px; }
#ds .ret-num-val { font-family: var(--serif); font-size: 36px; font-weight: 300; color: var(--cream); white-space: nowrap; }
#ds .ret-cta-lbl { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: rgba(234,227,217,.3); margin-bottom: 16px; }
#ds .ret-cta-btn { background: var(--cream); color: var(--ink); border: none; padding: 16px 48px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; transition: opacity .15s; }
#ds .ret-cta-btn:hover { opacity: .88; }

/* Fade animations */
#ds .fade-in { opacity: 0; transform: translateY(16px); transition: opacity .65s cubic-bezier(.25,.46,.45,.94), transform .65s cubic-bezier(.25,.46,.45,.94); }
#ds .fade-in.visible { opacity: 1; transform: none; }

/* ══ Global animation keyframes ═══════════════════════════ */
@keyframes ev-fade-up  { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
@keyframes ev-fade-in  { from { opacity:0; } to { opacity:1; } }
@keyframes ev-slide-in { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

/* ══ Login screen -- staggered entrance ════════════════════ */
.login-logo    { animation: ev-fade-up .8s .05s cubic-bezier(.25,.46,.45,.94) both; }
.login-heading { animation: ev-fade-up .9s .18s cubic-bezier(.25,.46,.45,.94) both; }
.login-sub     { animation: ev-fade-up .7s .34s cubic-bezier(.25,.46,.45,.94) both; }
.btn-google    { animation: ev-fade-up .7s .48s cubic-bezier(.25,.46,.45,.94) both; }

/* ══ Screen-level transitions ═════════════════════════════ */
#screen-login  { transition: opacity .32s ease; }
#screen-login.ev-out { opacity: 0; pointer-events: none; }
#screen-app.visible  { animation: ev-fade-in .3s .05s ease both; }

/* ══ Tab section enter ════════════════════════════════════ */
.main-section.ev-enter {
  animation: ev-slide-in .28s cubic-bezier(.25,.46,.45,.94) both;
}

/* ══ Content pane enter (editor / audit main) ═════════════ */
.ev-content-enter {
  animation: ev-slide-in .22s cubic-bezier(.25,.46,.45,.94) both;
}

/* ══ Nav tab ══════════════════════════════════════════════ */
.nav-tab { transition: color .2s ease, border-bottom-color .22s ease; }

/* ══ Sidebar collapse ════════════════════════════════════ */
.wr-sidebar, .au-sidebar {
  transition: width .3s cubic-bezier(.25,.46,.45,.94), min-width .3s cubic-bezier(.25,.46,.45,.94);
}
.wr-sidebar.collapsed, .au-sidebar.collapsed { width: 40px; min-width: 40px; }
.wr-sidebar.collapsed .wr-search,
.wr-sidebar.collapsed .wr-list,
.wr-sidebar.collapsed .wr-count,
.wr-sidebar.collapsed .wr-count-sub { opacity: 0; pointer-events: none; transition: opacity .15s; }
.au-sidebar.collapsed .au-list,
.au-sidebar.collapsed .btn-new-audit { opacity: 0; pointer-events: none; transition: opacity .15s; }
.wr-sidebar-hdr, .au-sidebar-hdr { position: relative; }
.sidebar-toggle {
  position: absolute; top: 12px; right: 10px;
  width: 26px; height: 26px; background: transparent;
  border: 1px solid var(--line); color: var(--muted); cursor: pointer;
  font-size: 13px; display: flex; align-items: center; justify-content: center;
  transition: border-color .15s, color .15s; flex-shrink: 0; z-index: 2;
}
.sidebar-toggle:hover { border-color: var(--ink); color: var(--ink); }
.wr-sidebar.collapsed .wr-lbl,
.au-sidebar.collapsed .au-lbl { opacity: 0; transition: opacity .15s; }
.wr-sidebar.collapsed .sidebar-toggle,
.au-sidebar.collapsed .sidebar-toggle { right: 7px; top: 7px; }

/* ══ Sidebar item delete button ══════════════════════════ */
.wr-item, .au-item { position: relative; }
.item-del-btn {
  position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
  width: 20px; height: 20px; background: transparent; border: none;
  color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1;
  opacity: 0; transition: opacity .15s, color .15s;
  display: flex; align-items: center; justify-content: center; padding: 0;
}
.wr-item:hover .item-del-btn,
.au-item:hover .item-del-btn { opacity: 1; }
.item-del-btn:hover { color: var(--red) !important; opacity: 1 !important; }

/* ══ Sidebar items ════════════════════════════════════════ */
.wr-item { transition: background .18s ease, border-left-color .18s ease; }
.au-item { transition: background .18s ease, border-left-color .18s ease; }

/* ══ Dashboard interactive polish ════════════════════════ */
#ds .quote-card    { transition: background .18s ease; }
#ds .quote-card:hover { background: rgba(206,198,186,.22); }
#ds .issue-row     { transition: background .15s ease, border-left-color .15s ease; }
#ds .insight-card  { transition: border-color .18s ease, background .18s ease; }
#ds .insight-card:hover { border-color: var(--muted); background: rgba(206,198,186,.1); }
#ds tr             { transition: background .15s ease; }
#ds tbody tr:hover td { background: rgba(206,198,186,.18); }

/* ══ Dashboard section stagger ═══════════════════════════ */
#ds .hero.fade-in      { transition-delay: 0s; }
#ds .val-hero.fade-in  { transition-delay: .06s; }
#ds .tl-section.fade-in{ transition-delay: .1s; }
#ds #ds-sessions .fade-in { transition-delay: .04s; }
#ds #ds-findings .fade-in  { transition-delay: .04s; }
#ds #ds-analysis .fade-in  { transition-delay: .04s; }
#ds #ds-roadmap .fade-in   { transition-delay: .04s; }

/* ══ Form field focus ════════════════════════════════════ */
#audit-form-wrap input,
#audit-form-wrap textarea,
#audit-form-wrap select { transition: border-color .2s ease; }

/* ══ All buttons -- consistent feel ══════════════════════ */
button { transition: opacity .15s ease, background .18s ease, border-color .18s ease, color .18s ease; }

/* ══ Form top bar entrance ═══════════════════════════════ */
.form-top-bar { animation: ev-fade-in .25s ease both; }

/* ══ Audit sidebar dashboard btn ════════════════════════ */
.au-dash-btn { transition: border-color .15s ease, color .15s ease; }

/* ══ Quick-win banner entrance ═══════════════════════════ */
#ds .quick-win { animation: ev-slide-in .35s .1s cubic-bezier(.25,.46,.45,.94) both; }

/* ══ Toast notifications ════════════════════════════════ */
.ev-toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--ink); color: var(--cream);
  padding: 11px 22px; font-size: 11px; letter-spacing: 0.16em;
  text-transform: uppercase; opacity: 0;
  transition: opacity .22s cubic-bezier(.25,.46,.45,.94), transform .22s cubic-bezier(.25,.46,.45,.94);
  z-index: 9999; pointer-events: none; white-space: nowrap;
}
.ev-toast.ev-toast-show { opacity: 1; transform: translateX(-50%) translateY(0); }
.ev-toast.ev-toast-warn { background: var(--red); }
.ev-toast.ev-toast-ok   { background: #3a6644; }
</style>
</head>

}

function startWritingListener() {
  if (wrUnsubscribe) { try { wrUnsubscribe(); } catch(e) {} wrUnsubscribe = null; }
  wrUnsubscribe = db.collection('writing')
    .orderBy('updated', 'desc')
    .onSnapshot(snap => {
      wrEntries = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderWritingList();
    }, err => {
      console.error('Writing listener error:', err);
      wrUnsubscribe = null;
      showToast('Sync issue -- reconnecting…', 'warn');
      setTimeout(() => { if (currentUser) startWritingListener(); }, 3000);
    });
}

function renderWritingList() {
  const q = (document.getElementById('wr-search')?.value || '').toLowerCase();
  const filtered = q
    ? wrEntries.filter(e => e.title.toLowerCase().includes(q) || (e.body||'').toLowerCase().includes(q))
    : wrEntries;

  document.getElementById('wr-count').textContent = wrEntries.length;

  const list = document.getElementById('wr-list');
  if (!list) return;
  if (filtered.length === 0) {
    list.innerHTML = `<div class="wr-empty"><p>${q ? 'No matches.' : 'No entries yet.\nCreate one →'}</p></div>`;
    return;
  }
  list.innerHTML = filtered.map(e => `
    <div class="wr-item${e.id === wrActiveId ? ' active' : ''}" onclick="openWritingEntry('${e.id}')">
      <div class="wr-item-title">${escH(e.title)}</div>
      <div class="wr-item-meta">
        <span class="wr-tag ${e.tag||'notes'}">${e.tag||'notes'}</span>
        <span class="wr-item-date">${relDate(e.updated)}</span>
      </div>
      <div class="wr-item-preview">${escH((e.body||'').slice(0,80).replace(/\n/g,' '))}</div>
      ${e.authorName ? `<div class="wr-author">${escH(e.authorName)}</div>` : ''}
      <button class="item-del-btn" onclick="deleteWritingEntry('${e.id}',event)" title="Delete">×</button>
    </div>
  `).join('');
}

function openWritingEntry(id) {
  flushWriting();
  wrActiveId = id;
  const e = wrEntries.find(x => x.id === id);
  if (!e) return;

  const pane = document.getElementById('wr-editor-content');
  pane.innerHTML = `
    <div class="wr-ed-bar">
      <input class="wr-ed-title" id="wr-ed-title" type="text" value="${escAttr(e.title)}" placeholder="Entry title…" oninput="onWrTitleChange()">
      <div class="wr-tag-btns">
        ${['transcript','copy','notes','ideas'].map(t => `
          <button class="wr-tag-btn${e.tag===t?' active-'+t:''}" onclick="setWrTag('${t}')">${t}</button>
        `).join('')}
      </div>
      <button class="wr-btn-clip" onclick="wrCopyAll()">Copy all</button>
      <button class="wr-btn-audit" onclick="generateAuditFromEntry()">Generate Audit →</button>
      <button class="wr-btn-del" onclick="deleteWritingEntry('${e.id}')">Delete</button>
    </div>
    <div class="wr-ed-body">
      <textarea class="wr-textarea" id="wr-ed-body" placeholder="Start writing, or paste your transcript here…" oninput="onWrBodyChange()" spellcheck="true">${escH(e.body||'')}</textarea>
    </div>
    <div class="wr-ed-footer">
      <div class="wr-stat">Words <span id="wr-wc">0</span></div>
      <div class="wr-stat">Characters <span id="wr-cc">0</span></div>
      <div class="wr-stat">Created <span>${longDate(e.created)}</span></div>
      <div class="wr-stat">By <span>${escH(e.authorName||'--')}</span></div>
      <button class="wr-btn-new-foot" onclick="newWritingEntry()">+ New entry</button>
    </div>
  `;
  pane.classList.add('ev-content-enter');
  setTimeout(() => pane.classList.remove('ev-content-enter'), 280);
  updateWrCounts();
  renderWritingList();
  document.getElementById('wr-ed-body')?.focus();
}

function flushWriting() {
  if (!wrActiveId) return;
  const titleEl = document.getElementById('wr-ed-title');
  const bodyEl  = document.getElementById('wr-ed-body');
  if (!titleEl || !bodyEl) return;
  db.collection('writing').doc(wrActiveId).update({
    title:   titleEl.value.trim() || 'Untitled',
    body:    bodyEl.value,
    updated: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(err => {
    console.warn('Write save failed:', err);
    showToast('Could not save -- check connection', 'warn');
  });
}

function onWrTitleChange() {
  const e = wrEntries.find(x => x.id === wrActiveId);
  if (!e) return;
  scheduleWrSave();
}
function onWrBodyChange() {
  scheduleWrSave();
  updateWrCounts();
}
function scheduleWrSave() {
  clearTimeout(wrSaveTimer);
  wrSaveTimer = setTimeout(() => flushWriting(), 800);
}

function updateWrCounts() {
  const body = document.getElementById('wr-ed-body')?.value || '';
  const wc = document.getElementById('wr-wc');
  const cc = document.getElementById('wr-cc');
  if (wc) wc.textContent = body.trim() ? body.trim().split(/\s+/).length.toLocaleString() : '0';
  if (cc) cc.textContent = body.length.toLocaleString();
}

function setWrTag(tag) {
  if (!wrActiveId) return;
  db.collection('writing').doc(wrActiveId).update({ tag, updated: firebase.firestore.FieldValue.serverTimestamp() });
  document.querySelectorAll('.wr-tag-btn').forEach(b => {
    b.className = 'wr-tag-btn';
    if (b.textContent === tag) b.classList.add('active-' + tag);
  });
}

function newWritingEntry() {
  if (wrCreating) return; // prevent double-click duplicates
  wrCreating = true;
  flushWriting();
  db.collection('writing').add({
    title:      'Untitled',
    tag:        'notes',
    body:       '',
    created:    firebase.firestore.FieldValue.serverTimestamp(),
    updated:    firebase.firestore.FieldValue.serverTimestamp(),
    authorId:   currentUser.uid,
    authorName: currentUser.displayName || currentUser.email
  }).then(ref => {
    wrActiveId = ref.id;
    wrCreating = false;
    renderWritingList();
    setTimeout(() => { openWritingEntry(ref.id); document.getElementById('wr-ed-title')?.select(); }, 300);
  }).catch(err => {
    wrCreating = false;
    console.warn('New entry failed:', err);
    showToast('Could not create entry -- check connection', 'warn');
  });
}

function deleteWritingEntry(id, e) {
  if (e) e.stopPropagation();
  if (!confirm('Delete this entry? Cannot be undone.')) return;
  db.collection('writing').doc(id).delete();
  if (wrActiveId === id) {
    wrActiveId = null;
    document.getElementById('wr-editor-content').innerHTML = `
      <div class="wr-no-entry">
        <div class="wr-no-entry-h">Deleted.</div>
        <div class="wr-no-entry-s">Entry removed</div>
        <button class="wr-btn-start" onclick="newWritingEntry()">+ New entry</button>
      </div>`;
  }
}

function toggleWrSidebar() {
  const sb  = document.getElementById('wr-sidebar');
  const btn = document.getElementById('wr-toggle');
  sb.classList.toggle('collapsed');
  btn.textContent = sb.classList.contains('collapsed') ? '›' : '‹';
  btn.title       = sb.classList.contains('collapsed') ? 'Expand sidebar' : 'Collapse sidebar';
}

function toggleAuSidebar() {
  const sb  = document.getElementById('au-sidebar');
  const btn = document.getElementById('au-toggle');
  sb.classList.toggle('collapsed');
  btn.textContent = sb.classList.contains('collapsed') ? '›' : '‹';
  btn.title       = sb.classList.contains('collapsed') ? 'Expand sidebar' : 'Collapse sidebar';
}

function deleteAudit(id, e) {
  if (e) e.stopPropagation();
  if (!confirm('Delete this audit? Cannot be undone.')) return;
  db.collection('audits').doc(id).delete();
  if (auActiveId === id) {
    auActiveId = null;
    document.getElementById('form-actions')?.remove();
    const main = document.getElementById('au-main');
    main.innerHTML = `
      <div class="au-empty">
        <div class="au-empty-h">Deleted.</div>
        <div class="au-empty-s">Select an audit or create a new one</div>
      </div>`;
    main.classList.add('ev-content-enter');
    setTimeout(() => main.classList.remove('ev-content-enter'), 280);
  }
}

function wrCopyAll() {
  const body = document.getElementById('wr-ed-body')?.value || '';
  navigator.clipboard.writeText(body).then(() => {
    const btn = document.querySelector('.wr-btn-clip');
    if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy all', 1500); }
  });
}

function renderAuditList() {

  if (!list) return;

    list.innerHTML = `<div class="wr-empty"><p>No audits yet.</p></div>`;

function openAuditDashboard(id, e) {
  if (e) e.stopPropagation();
  auActiveId = id;

  document.getElementById('form-actions')?.remove();

function openAudit(id) {
  auActiveId = id;
  const a = auAudits.find(x => x.id === id);
  if (!a) return;
  renderWritingList(); // in case we switched
  renderAuditList();
  // Load form with saved data, then switch to form view
  renderAuditForm(a.formData);
}

function newAudit() {
  auActiveId = null;
  auCurrentFormData = null;
  renderAuditList();
  renderAuditForm(null);

}

function renderAuditForm(data) {
  const main = document.getElementById('au-main');
  const tpl  = document.getElementById('tpl-audit-form');
  main.innerHTML = '';
  main.appendChild(tpl.content.cloneNode(true));
  main.classList.add('ev-content-enter');
  setTimeout(() => main.classList.remove('ev-content-enter'), 280);

  if (data) loadAuditFormFields(data);

  // Remove any existing form-actions and re-append to ensure it's in the new DOM
  const existingBar = document.getElementById('form-actions');
  if (existingBar) existingBar.remove();
}

function loadAuditFormFields(d) {
  const f = (id, val) => { const el = document.getElementById(id); if (el && val !== undefined) el.value = val; };
  f('f-name', d.name); f('f-revenue', d.revenue); f('f-founder', d.founder);
  f('f-ftitle', d.founderTitle); f('f-headcount', d.headcount); f('f-years', d.years);
  f('f-location', d.location); f('f-date', d.date);
  f('f-total-num', d.totalNum); f('f-total-display', d.totalDisplay);
  f('f-td', d.td); f('f-ml', d.ml); f('f-rg', d.rg); f('f-sf', d.sf);
  // Activities
  if (d.activities) d.activities.forEach((a,i) => {
    const n = i+1;
    f(`f-a${n}l`, a.label); f(`f-a${n}h`, a.hours);
  });
  // Dynamic rows
  if (d.quotes)   d.quotes.forEach(q => addQuote(q));
  if (d.issues)   d.issues.forEach(x => addIssue(x));
  if (d.roadmap)  d.roadmap.forEach(r => addRoadmap(r));
  // Retainer
  f('f-roi', d.roi); f('f-ret-val', d.retVal);
  f('f-ret-fixes', d.retFixes); f('f-ret-con', d.retCon);
}

// ── Read form data ────────────────────────────────────────
function getAuditFormData() {
  const v = id => (document.getElementById(id)?.value || '').trim();
  const n = id => parseFloat(document.getElementById(id)?.value) || 0;

  const activities = [1,2,3,4,5,6].map(i => ({
    label: v(`f-a${i}l`), hours: n(`f-a${i}h`)
  })).filter(a => a.label);

  const quotes = [...document.querySelectorAll('#f-quotes-list .dyn-row')].map(row => {
    const inputs = row.querySelectorAll('input,textarea,select');
    return { text: inputs[0].value.trim(), name: inputs[1].value.trim(), role: inputs[2].value.trim(), session: inputs[3].value };
  }).filter(q => q.text);

  const issues = [...document.querySelectorAll('#f-issues-list .dyn-row')].map(row => {
    const inputs = row.querySelectorAll('input,select');
    return { name: inputs[0].value.trim(), detail: inputs[1].value.trim(), val: inputs[2].value.trim(), sev: inputs[3].value, from: inputs[4].value.trim() };
  }).filter(i => i.name);

  const roadmap = [...document.querySelectorAll('#f-roadmap-list .dyn-row')].map(row => {
    const inputs = row.querySelectorAll('input,select');
    return { name: inputs[0].value.trim(), cat: inputs[1].value.trim(), effort: inputs[2].value, val: inputs[3].value.trim(), valNum: parseFloat(inputs[4].value)||0, timeline: inputs[5].value.trim() };
  }).filter(r => r.name);

  return {
    name: v('f-name'), revenue: v('f-revenue'), founder: v('f-founder'),
    founderTitle: v('f-ftitle'), headcount: v('f-headcount'), years: v('f-years'),
    location: v('f-location'), date: v('f-date'),
    totalNum: n('f-total-num'), totalDisplay: v('f-total-display'),
    td: v('f-td'), ml: v('f-ml'), rg: v('f-rg'), sf: v('f-sf'),
    activities, quotes, issues, roadmap,
    roi: v('f-roi'), retVal: v('f-ret-val'), retFixes: v('f-ret-fixes'), retCon: v('f-ret-con')
  };
}

// ── Save draft ────────────────────────────────────────────
async function saveAuditDraft() {
  const d = getAuditFormData();
  const payload = {
    clientName:    d.name || 'Untitled',
    totalDisplay:  d.totalDisplay,
    formData:      d,
    updated:       firebase.firestore.FieldValue.serverTimestamp(),
    updatedByName: currentUser.displayName || currentUser.email
  };
  try {
    if (auActiveId) {
      await db.collection('audits').doc(auActiveId).update(payload);
    } else {
      payload.created       = firebase.firestore.FieldValue.serverTimestamp();
      payload.createdByName = currentUser.displayName || currentUser.email;
      payload.createdById   = currentUser.uid;
      const ref = await db.collection('audits').add(payload);
      auActiveId = ref.id;
    }
    const btn = document.querySelector('.btn-save-audit');
    if (btn) { btn.textContent = 'Saved ✓'; setTimeout(() => btn.textContent = 'Save draft', 2000); }
  } catch(err) {
    console.warn('Save audit draft failed:', err);
    showToast('Could not save audit -- check connection', 'warn');
    throw err; // re-throw so callers can catch
  }
}

// ── Generate dashboard ────────────────────────────────────
async function generateAuditDashboard() {
  const d = getAuditFormData();
  // Auto-save first
  await saveAuditDraft().catch(() => {});
  // Render dashboard
  showAuditDashboard(d);
}

function renderDashboard(d) {
  const el = (id, val) => { const e = document.getElementById(id); if (e) e.textContent = val; };

  el('db-info-client', d.name);
  el('db-info-date', d.date);
  el('db-info-location', d.location);
  el('db-name', d.name);
  el('db-revenue', d.revenue);
  el('db-headcount', d.headcount);
  el('db-years', d.years);
  el('db-founder', (d.founder||'') + ' -- ' + (d.founderTitle||''));
  el('db-td', d.td); el('db-ml', d.ml); el('db-rg', d.rg); el('db-sf', d.sf);
  el('db-ml2', d.ml); el('db-rg2', d.rg);

  // Highlight dominant financial category
  const _catNums = {
    td: parseRandNum(d.td), ml: parseRandNum(d.ml),
    rg: parseRandNum(d.rg), sf: parseRandNum(d.sf)
  };
  const _domCat = Object.entries(_catNums).sort((a,b)=>b[1]-a[1])[0]?.[0];
  const _catElMap = { td:'db-td', ml:'db-ml', rg:'db-rg', sf:'db-sf' };
  if (_domCat && _catNums[_domCat] > 0) {
    const _domEl = document.getElementById(_catElMap[_domCat])?.closest('.val-cat');
    if (_domEl) _domEl.classList.add('dominant');
  }
  el('db-issue-count', d.issues.length);
  el('db-findings-sub', `${d.issues.length} issues confirmed - Total value quantified in rand per day`);

  // Time lost from activities
  const totalHrs = d.activities.reduce((s,a) => s + (a.hours||0), 0);
  el('db-hrs', totalHrs + ' hrs');

  // Quotes
  const qWrap = document.getElementById('db-quotes');
  if (qWrap) qWrap.innerHTML = d.quotes.map(q => `
    <div class="quote-card">
      <div class="quote-body">"${escH(q.text)}"</div>
      <div class="quote-attr">${escH(q.name)} -- ${escH(q.role)}</div>
      <span class="quote-tag ${q.session}">${q.session === 'founder' ? 'Founder Session' : 'Team Session'}</span>
    </div>
  `).join('');

  // Issues -- sorted by severity then value, top issue highlighted
  const _sevRank = { critical: 3, high: 2, medium: 1 };
  const _sortedIssues = [...d.issues].sort((a, b) =>
    (_sevRank[b.sev]||1) - (_sevRank[a.sev]||1) ||
    parseRandNum(b.val) - parseRandNum(a.val)
  );
  const iWrap = document.getElementById('db-issues');
  if (iWrap) iWrap.innerHTML = _sortedIssues.map((x,i) => `
    <div class="issue-row${i === 0 ? ' issue-top' : ''}">
      <span class="issue-num">${String(i+1).padStart(2,'0')}</span>
      <div style="flex:1">
        <div class="issue-name">${escH(x.name)}</div>
        <div class="issue-detail">${escH(x.detail)}</div>
      </div>
      <span class="issue-sev ${x.sev}">${x.sev}</span>
      <span class="issue-val">${escH(x.val)}</span>
    </div>
  `).join('');

  // AI insights (auto-generated from top issues, sorted)
  const insWrap = document.getElementById('db-insights');
  if (insWrap) insWrap.innerHTML = _sortedIssues.slice(0,4).map((x,i) => `
    <div class="insight-card">
      <div class="insight-tag">Insight ${i+1} -- ${x.sev} priority</div>
      <div class="insight-body">${escH(x.name)}. ${escH(x.detail)}</div>
    </div>
  `).join('');

  // Quick-win banner -- highest-value Low-effort roadmap item
  const _quickWin = [...d.roadmap]
    .filter(r => (r.effort||'').toLowerCase() === 'low')
    .sort((a,b) => (b.valNum||0) - (a.valNum||0))[0];
  const _roadmapWrap = document.querySelector('#ds .roadmap-wrap');
  const _existingQW  = _roadmapWrap?.querySelector('.quick-win');
  if (_existingQW) _existingQW.remove();
  if (_quickWin && _roadmapWrap) {
    const _qwDiv = document.createElement('div');
    _qwDiv.className = 'quick-win';
    _qwDiv.innerHTML = `
      <span class="qw-label">Top quick win</span>
      <span class="qw-name">${escH(_quickWin.name)}</span>
      <span class="qw-val">${escH(_quickWin.val)}</span>
      <span class="qw-effort">Low effort</span>
    `;
    const _table = _roadmapWrap.querySelector('table');
    if (_table) _roadmapWrap.insertBefore(_qwDiv, _table);
  }

  // Roadmap table
  const tbody = document.getElementById('db-roadmap-tbody');
  if (tbody) tbody.innerHTML = d.roadmap.map((r,i) => {
    const pct = d.totalNum ? Math.min(95, Math.round((r.valNum||0) / d.totalNum * 100)) : 0;
    return `<tr${i===0?' class="rm-top"':''}>
      <td class="pt-rank">${String(i+1).padStart(2,'0')}</td>
      <td><div class="pt-name">${escH(r.name)}</div><div class="pt-cat">${escH(r.cat)}</div>
        <div class="pt-bar-wrap"><div class="pt-bar" style="width:${pct}%"></div></div></td>
      <td><span class="pt-effort ${(r.effort||'').toLowerCase()}">${escH(r.effort)}</span></td>
      <td class="pt-value">${escH(r.val)}</td>
      <td class="pt-timeline">${escH(r.timeline)}</td>
    </tr>`;
  }).join('');

  // Retainer
  el('db-roi', d.roi);
  el('db-ret-hl', d.retVal);
  el('db-ret-fixes', d.retFixes);
  el('db-ret-con', d.retCon);
}

function renderCharts(d) {
  if (donutChart) { donutChart.destroy(); donutChart = null; }
  if (barChart)   { barChart.destroy();   barChart   = null; }

  const donutEl = document.getElementById('db-donut');
  const barEl   = document.getElementById('db-bar');
  if (!donutEl || !barEl) return;

  const cream = '#EAE3D9', red = '#BF3E28', ink = '#1A1612', muted = '#8A7F73', line = '#CEC6BA';
  Chart.defaults.color = muted;
  Chart.defaults.font.family = "'Courier New', monospace";
  Chart.defaults.font.size = 10;

  const tdN  = parseFloat(String(d.td).replace(/[^0-9.]/g,''))||0;
  const mlN  = parseFloat(String(d.ml).replace(/[^0-9.]/g,''))||0;
  const rgN  = parseFloat(String(d.rg).replace(/[^0-9.]/g,''))||0;
  const sfN  = parseFloat(String(d.sf).replace(/[^0-9.]/g,''))||0;

  donutChart = new Chart(donutEl, {
    type: 'doughnut',
    data: {
      labels: ['Tech Debt', 'Money Leaks', 'Revenue Gaps', 'Staff Friction'],
      datasets: [{ data: [tdN, mlN, rgN, sfN], backgroundColor: [ink, red, muted, line], borderWidth: 0 }]
    },
    options: { responsive: true, maintainAspectRatio: false, cutout: '68%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, padding: 16 } } } }
  });

  barChart = new Chart(barEl, {
    type: 'bar',
    data: {
      labels: d.activities.map(a => a.label),
      datasets: [{ data: d.activities.map(a => a.hours), backgroundColor: red, borderWidth: 0 }]
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: line }, ticks: { color: muted } },
        y: { grid: { display: false }, ticks: { color: muted } }
      }
    }
  });
}

function animateCounter(target) {
  const el = document.getElementById('db-counter');
  if (!el || !target) return;
  const start = Date.now(), dur = 1800;
  const fmt = n => 'R ' + Math.round(n).toLocaleString('en-ZA').replace(/,/g,' ');
  function tick() {
    const t = Math.min(1, (Date.now()-start)/dur);
    const ease = 1 - Math.pow(1-t, 3);
    el.textContent = fmt(ease * target);
    if (t < 1) requestAnimationFrame(tick);
    else el.textContent = fmt(target);
  }
  requestAnimationFrame(tick);
}

function initFadeIn() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.05 });
  document.querySelectorAll('#ds .fade-in').forEach(el => obs.observe(el));
}
