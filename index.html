<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lliam Humphrey</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <meta name="description" content="20. Building businesses in public from South Africa. Entrepreneur · Founder." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; }
    body { background: #0A0709; -webkit-font-smoothing: antialiased; }
    @keyframes siteReveal { from { opacity: 0; } to { opacity: 1; } }
    #root { animation: siteReveal 1s ease both; }
    @media (max-width: 768px) {
      .sidebar-nav  { display: none !important; }
      .site-wrap    { margin-left: 0 !important; }
      .mobile-nav   { display: flex !important; }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    // ─── Palette ─────────────────────────────────────────────────────
    const T = {
      white:    '#0A0709',
      warm:     '#110D10',
      ink:      '#F5F0F4',
      dim:      'rgba(245,240,244,0.5)',
      faint:    'rgba(245,240,244,0.28)',
      rule:     'rgba(245,240,244,0.1)',
      plum:     '#A855A0',
      plumSoft: 'rgba(168,85,160,0.1)',
      plumMid:  'rgba(168,85,160,0.4)',
    };

    const grotesk = "'Cormorant Garamond', serif";
    const serif   = "'Cormorant Garamond', serif";
    const script  = "'Pinyon Script', cursive";

    // ─── Sidebar Nav ─────────────────────────────────────────────────
    const SideNav = () => (
      <nav className="sidebar-nav" style={{
        position:'fixed', left:0, top:0, bottom:0, width:44, zIndex:20,
        display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'space-between',
        padding:'28px 0', borderRight:`1px solid ${T.rule}`, background:T.white,
      }}>
        <span style={{ fontFamily:script, fontSize:22, color:T.plum, lineHeight:1 }}>LH</span>
        <div style={{ display:'flex', flexDirection:'column', gap:36, alignItems:'center' }}>
          {[['HOME','#top'],['VENTURES','#ventures'],['ABOUT','#about']].map(([label,href]) => (
            <a key={label} href={href} style={{
              writingMode:'vertical-rl', transform:'rotate(180deg)',
              fontSize:7, letterSpacing:'0.32em', textTransform:'uppercase',
              color:T.faint, textDecoration:'none', fontFamily:grotesk, fontWeight:500, transition:'color .2s',
            }}
            onMouseEnter={e=>e.currentTarget.style.color=T.plum}
            onMouseLeave={e=>e.currentTarget.style.color=T.faint}
            >{label}</a>
          ))}
        </div>
        <div style={{ width:5, height:5, borderRadius:'50%', background:T.plum }} />
      </nav>
    );

    // ─── Mobile Nav ──────────────────────────────────────────────────
    const MobileNav = ({ scrolled }) => (
      <nav className="mobile-nav" style={{
        display:'none', position:'fixed', top:0, left:0, right:0, zIndex:20,
        padding:'14px 20px', justifyContent:'space-between', alignItems:'center',
        background: scrolled ? 'rgba(255,255,255,0.95)' : 'transparent',
        backdropFilter: scrolled ? 'blur(12px)' : 'none',
        borderBottom: scrolled ? `1px solid ${T.rule}` : 'none',
        transition:'all .3s',
      }}>
        <span style={{ fontFamily:grotesk, fontWeight:700, fontSize:10, letterSpacing:'0.3em', textTransform:'uppercase', color:T.ink }}>Lliam Humphrey</span>
        <div style={{ display:'flex', gap:24 }}>
          <a href="#ventures" style={{ fontFamily:grotesk, fontSize:9, letterSpacing:'0.26em', textTransform:'uppercase', color:T.dim, textDecoration:'none' }}>Ventures</a>
          <a href="#about" style={{ fontFamily:grotesk, fontSize:9, letterSpacing:'0.26em', textTransform:'uppercase', color:T.dim, textDecoration:'none' }}>About</a>
        </div>
      </nav>
    );

    // ─── Waitlist Modal (dark, premium) ──────────────────────────────
    const WaitlistModal = ({ open, onClose }) => {
      const [email, setEmail]       = useState('');
      const [name, setName]         = useState('');
      const [social, setSocial]     = useState('');
      const [submitted, setSubmitted]   = useState(false);
      const [submitting, setSubmitting] = useState(false);
      const [error, setError]           = useState(false);

      useEffect(() => { if (!open) setTimeout(() => { setEmail(''); setName(''); setSocial(''); setSubmitted(false); setError(false); }, 400); }, [open]);
      useEffect(() => {
        const onKey = e => { if (e.key === 'Escape' && open) onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [open, onClose]);

      const submit = async e => {
        e.preventDefault();
        if (!email) return;
        setSubmitting(true);
        try {
          const res = await fetch('/api/brevo-subscribe', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify({ email, name, social }),
          });
          if (!res.ok) throw new Error('failed');
          setSubmitted(true);
        } catch (_) { setError(true); }
        finally { setSubmitting(false); }
      };

      const bg='#0F0C0E', ink='#F0EDE8', dim='rgba(240,237,232,0.5)', accent=T.plum;
      const inputStyle = { width:'100%', padding:'14px 0', background:'transparent', border:'none', borderBottom:'1px solid rgba(240,237,232,0.15)', fontFamily:grotesk, fontSize:16, color:ink, outline:'none', boxSizing:'border-box' };

      return (
        <>
          <div onClick={onClose} style={{ position:'fixed', inset:0, zIndex:100, background:'rgba(8,6,8,0.75)', backdropFilter:'blur(4px)', opacity:open?1:0, pointerEvents:open?'auto':'none', transition:'opacity .35s ease' }} />
          <aside style={{ position:'fixed', top:0, right:0, bottom:0, zIndex:101, width:'min(520px,96vw)', background:bg, color:ink, fontFamily:grotesk, transform:open?'translateX(0)':'translateX(102%)', transition:'transform .5s cubic-bezier(.2,.7,.2,1)', display:'flex', flexDirection:'column', boxShadow:'-30px 0 80px rgba(0,0,0,0.6)', borderLeft:`1px solid rgba(107,45,94,0.3)`, overflow:'hidden' }}>
            <div style={{ position:'absolute', top:0, left:0, right:0, height:2, background:accent }} />
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'24px 32px', borderBottom:'1px solid rgba(240,237,232,0.08)', fontSize:10, letterSpacing:'0.32em', textTransform:'uppercase', color:dim }}>
              <span>Private Victories Club · Waitlist</span>
              <button onClick={onClose} style={{ border:'none', background:'transparent', color:ink, fontSize:18, cursor:'pointer', width:28, height:28, display:'flex', alignItems:'center', justifyContent:'center' }}>&times;</button>
            </div>
            <div style={{ flex:1, overflowY:'auto', padding:'40px 40px 32px' }}>
              {submitted ? (
                <div style={{ textAlign:'center', paddingTop:48 }}>
                  <div style={{ width:56, height:56, border:`1px solid ${accent}`, margin:'0 auto 28px', display:'flex', alignItems:'center', justifyContent:'center', fontSize:22, color:accent }}>&#10003;</div>
                  <div style={{ fontSize:9, color:accent, letterSpacing:'0.4em', textTransform:'uppercase', marginBottom:18 }}>You're on the list</div>
                  <h2 style={{ fontFamily:serif, fontStyle:'italic', fontWeight:300, fontSize:36, letterSpacing:'-0.015em', margin:0, color:ink }}>See you on the inside.</h2>
                  <p style={{ marginTop:22, color:dim, fontSize:14, lineHeight:1.7, maxWidth:340, marginInline:'auto' }}>We'll be in touch at <strong style={{ color:ink, fontWeight:500 }}>{email}</strong> when doors open.</p>
                  <button onClick={onClose} style={{ marginTop:40, padding:'14px 26px', fontSize:10, border:`1px solid rgba(240,237,232,0.2)`, background:'transparent', color:ink, cursor:'pointer', fontFamily:grotesk, letterSpacing:'0.32em', textTransform:'uppercase', fontWeight:500 }}>Close</button>
                </div>
              ) : (
                <div>
                  <div style={{ fontSize:9, color:accent, letterSpacing:'0.4em', textTransform:'uppercase', marginBottom:16, fontWeight:500 }}>Members Club</div>
                  <h2 style={{ fontFamily:grotesk, fontWeight:500, fontSize:32, letterSpacing:'-0.05em', margin:0, lineHeight:1.0, color:ink }}>Join the waitlist</h2>
                  <p style={{ marginTop:16, fontSize:14, lineHeight:1.75, color:dim }}>Africa's private members club for entrepreneurs.</p>
                  <form onSubmit={submit} style={{ marginTop:36, display:'flex', flexDirection:'column', gap:22 }}>
                    <label style={{ display:'flex', flexDirection:'column', gap:10 }}>
                      <span style={{ fontSize:9, letterSpacing:'0.32em', textTransform:'uppercase', fontWeight:500, color:dim }}>Your name</span>
                      <input value={name} onChange={e=>setName(e.target.value)} placeholder="Anya Reyes" required style={inputStyle} />
                    </label>
                    <label style={{ display:'flex', flexDirection:'column', gap:10 }}>
                      <span style={{ fontSize:9, letterSpacing:'0.32em', textTransform:'uppercase', fontWeight:500, color:dim }}>Email address</span>
                      <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="anya@studio.com" required style={inputStyle} />
                    </label>
                    <label style={{ display:'flex', flexDirection:'column', gap:10 }}>
                      <span style={{ fontSize:9, letterSpacing:'0.32em', textTransform:'uppercase', fontWeight:500, color:dim }}>Instagram or TikTok</span>
                      <input value={social} onChange={e=>setSocial(e.target.value)} placeholder="@anya.reyes" required style={inputStyle} />
                    </label>
                    {error && <p style={{ fontSize:12, color:'#e05a6b', fontFamily:grotesk }}>Something went wrong. Please try again.</p>}
                    <button type="submit" disabled={submitting||!email||!name||!social} style={{ marginTop:8, padding:'16px 24px', border:'none', borderRadius:999, background:email&&name&&social&&!submitting?accent:'rgba(107,45,94,0.3)', color:ink, fontSize:10, letterSpacing:'0.3em', cursor:email&&name&&social&&!submitting?'pointer':'not-allowed', fontFamily:grotesk, fontWeight:500, textTransform:'uppercase', transition:'all .2s' }}>
                      {submitting ? 'Joining...' : 'Join the waitlist'}
                    </button>
                  </form>
                </div>
              )}
            </div>
          </aside>
        </>
      );
    };

    // ─── Setter Modal (light) ─────────────────────────────────────────
    const SetterModal = ({ open, onClose }) => {
      useEffect(() => {
        const onKey = e => { if (e.key === 'Escape' && open) onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [open, onClose]);

      return (
        <>
          <div onClick={onClose} style={{ position:'fixed', inset:0, zIndex:100, background:'rgba(8,6,8,0.5)', backdropFilter:'blur(4px)', opacity:open?1:0, pointerEvents:open?'auto':'none', transition:'opacity .35s ease' }} />
          <aside style={{ position:'fixed', top:0, right:0, bottom:0, zIndex:101, width:'min(580px,96vw)', background:T.white, color:T.ink, fontFamily:grotesk, transform:open?'translateX(0)':'translateX(102%)', transition:'transform .5s cubic-bezier(.2,.7,.2,1)', display:'flex', flexDirection:'column', boxShadow:'-30px 0 80px rgba(0,0,0,0.25)', borderLeft:`1px solid ${T.rule}`, overflow:'hidden' }}>
            <div style={{ position:'absolute', top:0, left:0, right:0, height:2, background:T.plum }} />
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'24px 32px', borderBottom:`1px solid ${T.rule}`, fontSize:10, letterSpacing:'0.32em', textTransform:'uppercase', color:T.faint }}>
              <span>Setter Management Co. · What We Do</span>
              <button onClick={onClose} style={{ border:'none', background:'transparent', color:T.ink, fontSize:18, cursor:'pointer', width:28, height:28, display:'flex', alignItems:'center', justifyContent:'center' }}>&times;</button>
            </div>
            <div style={{ flex:1, overflowY:'auto', padding:'48px 40px 48px' }}>
              <div style={{ fontSize:9, color:T.plum, letterSpacing:'0.4em', textTransform:'uppercase', marginBottom:20, fontWeight:500 }}>The Work</div>
              <h2 style={{ fontFamily:grotesk, fontWeight:500, fontSize:'clamp(28px,3.5vw,44px)', letterSpacing:'-0.05em', margin:'0 0 24px', lineHeight:1.0, color:T.ink }}>Fix What's Actually Leaking Money</h2>
              <p style={{ fontSize:16, lineHeight:1.85, color:T.dim, margin:'0 0 36px', fontFamily:serif }}>
                I audit, manage and scale setting teams for high-ticket coaches and consultants doing $20k/month or more.
              </p>
              <div style={{ padding:'28px 0', borderTop:`1px solid ${T.rule}`, borderBottom:`1px solid ${T.rule}`, marginBottom:36, display:'flex', flexDirection:'column', gap:18 }}>
                {[
                  '$250k/month in fixable leaks found inside a $1M/month sales team',
                  '$175k personally collected in 6 months as a brand-new setter',
                ].map((s,i) => (
                  <div key={i} style={{ display:'flex', gap:16, alignItems:'flex-start' }}>
                    <span style={{ color:T.plum, fontSize:14, marginTop:1, flexShrink:0 }}>·</span>
                    <p style={{ fontSize:14, lineHeight:1.75, color:T.dim, margin:0, fontFamily:serif }}>{s}</p>
                  </div>
                ))}
              </div>
              <p style={{ fontSize:14, lineHeight:1.9, color:T.faint, margin:'0 0 44px', fontFamily:serif }}>
                Every diagnosis follows the same process: pull the real data across all fronts and compare against a real baseline, then fix and scale it.
              </p>
              <a href="https://instagram.com/lliam.humphrey" target="_blank" rel="noopener noreferrer" style={{ display:'inline-block', padding:'16px 28px', borderRadius:999, background:T.plum, color:T.white, fontSize:10, letterSpacing:'0.3em', textTransform:'uppercase', fontFamily:grotesk, fontWeight:500, textDecoration:'none' }}>
                DM on Instagram
              </a>
            </div>
          </aside>
        </>
      );
    };

    // ─── Venture Card ─────────────────────────────────────────────────
    const VentureCard = ({ num, eyebrow, title, desc, cta, onCta, href }) => {
      const [hov, setHov] = useState(false);
      return (
        <div style={{ background:T.white, border:`1px solid ${T.rule}`, padding:'clamp(36px,5vw,56px)', minHeight:380, display:'flex', flexDirection:'column', position:'relative', overflow:'hidden', transition:'border-color .2s', borderColor: hov ? T.plum : T.rule }}
          onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}>
          <div style={{ position:'absolute', top:0, left:0, right:0, height:2, background: hov ? T.plum : T.rule, transition:'background .2s' }} />
          <div style={{ flex:1, display:'flex', flexDirection:'column' }}>
            <div style={{ fontSize:9, color:T.plum, letterSpacing:'0.4em', textTransform:'uppercase', marginBottom:24, fontFamily:grotesk, fontWeight:500 }}>0{num} · {eyebrow}</div>
            <h3 style={{ fontFamily:grotesk, fontWeight:500, fontSize:'clamp(26px,3vw,40px)', letterSpacing:'-0.05em', color:T.ink, lineHeight:1.0, margin:0 }}>{title}</h3>
            <p style={{ marginTop:20, fontSize:15, lineHeight:1.9, color:T.dim, fontFamily:grotesk, fontWeight:300, flex:1, maxWidth:420 }}>{desc}</p>
            <div style={{ marginTop:40 }}>
              {href ? (
                <a href={href} style={{ display:'inline-block', padding:'14px 28px', borderRadius:999, background: hov ? T.plum : 'transparent', color: hov ? T.white : T.ink, border:`1px solid ${hov ? T.plum : T.ink}`, fontSize:10, letterSpacing:'0.3em', textTransform:'uppercase', fontFamily:grotesk, fontWeight:500, textDecoration:'none', transition:'all .2s' }}>{cta}</a>
              ) : (
                <button onClick={onCta} style={{ padding:'14px 28px', borderRadius:999, background: hov ? T.plum : 'transparent', color: hov ? T.white : T.ink, border:`1px solid ${hov ? T.plum : T.ink}`, fontSize:10, letterSpacing:'0.3em', textTransform:'uppercase', fontFamily:grotesk, fontWeight:500, cursor:'pointer', transition:'all .2s' }}>{cta}</button>
              )}
            </div>
          </div>
        </div>
      );
    };

    // ─── Hub Page ─────────────────────────────────────────────────────
    const Hub = ({ onWaitlist, onSetter }) => {
      const [scrollY,  setScrollY]  = useState(0);
      const [revealed, setRevealed] = useState({});
      const containerRef = useRef(null);

      useEffect(() => {
        let raf;
        const onScroll = () => {
          if (raf) cancelAnimationFrame(raf);
          raf = requestAnimationFrame(() => setScrollY(window.scrollY));
        };
        window.addEventListener('scroll', onScroll, { passive:true });
        const io = new IntersectionObserver(
          es => { es.forEach(e => { if (e.isIntersecting) setRevealed(r => ({ ...r, [e.target.dataset.reveal]:true })); }); },
          { threshold:0.08 }
        );
        const el = containerRef.current;
        if (el) el.querySelectorAll('[data-reveal]').forEach(n => io.observe(n));
        return () => { window.removeEventListener('scroll', onScroll); if (raf) cancelAnimationFrame(raf); io.disconnect(); };
      }, []);

      const reveal = k => ({
        opacity: revealed[k] ? 1 : 0,
        transform: revealed[k] ? 'translateY(0)' : 'translateY(22px)',
        transition: 'opacity 1s ease, transform 1s cubic-bezier(.2,.7,.2,1)',
      });

      return (
        <div ref={containerRef} style={{ background:T.white, color:T.ink, fontFamily:grotesk }}>

          <MobileNav scrolled={scrollY > 20} />

          {/* ── HERO ── */}
          <header id="top" style={{ minHeight:'100svh', display:'flex', position:'relative', overflow:'hidden' }}>

            {/* Left: name + details */}
            <div style={{ flex:1, display:'flex', flexDirection:'column', justifyContent:'space-between', padding:'clamp(60px,7vw,100px) clamp(32px,5vw,72px)', minWidth:0 }}>

              {/* Top: scroll hint */}
              <div style={{ display:'flex', alignItems:'center', gap:12 }}>
                <div style={{ width:20, height:1, background:T.plum }} />
                <span style={{ fontFamily:grotesk, fontSize:9, letterSpacing:'0.36em', textTransform:'uppercase', color:T.plum, fontWeight:500 }}>South Africa · 20</span>
              </div>

              {/* Middle: oversized name */}
              <div>
                <h1 style={{ fontFamily:grotesk, fontWeight:500, fontSize:'clamp(72px,12vw,180px)', lineHeight:0.88, letterSpacing:'-0.02em', color:T.ink, margin:0 }}>
                  Lliam
                </h1>
                <h1 style={{ fontFamily:grotesk, fontWeight:500, fontSize:'clamp(72px,12vw,180px)', lineHeight:0.88, letterSpacing:'-0.02em', color:T.plum, margin:0 }}>
                  Humphrey
                </h1>
                <p style={{ marginTop:28, fontFamily:grotesk, fontWeight:300, fontSize:'clamp(13px,1.1vw,16px)', color:T.dim, letterSpacing:'0.01em', maxWidth:340 }}>
                  Visionary. Entrepreneur. Building in public from South Africa.
                </p>
              </div>

              {/* Bottom: social links */}
              <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                <a href="https://instagram.com/lliam.humphrey" target="_blank" rel="noopener noreferrer" style={{ display:'flex', alignItems:'center', gap:12, textDecoration:'none', color:T.dim, fontSize:12, fontFamily:grotesk, fontWeight:300, letterSpacing:'0.02em', transition:'color .2s' }}
                  onMouseEnter={e=>e.currentTarget.style.color=T.plum}
                  onMouseLeave={e=>e.currentTarget.style.color=T.dim}>
                  <span style={{ width:16, height:16, border:`1px solid ${T.rule}`, borderRadius:3, display:'flex', alignItems:'center', justifyContent:'center', fontSize:7, flexShrink:0, fontFamily:grotesk, fontWeight:600, letterSpacing:'0.05em' }}>ig</span>
                  instagram.com/lliam.humphrey
                </a>
                <a href="https://tiktok.com/@lliam.humphrey" target="_blank" rel="noopener noreferrer" style={{ display:'flex', alignItems:'center', gap:12, textDecoration:'none', color:T.dim, fontSize:12, fontFamily:grotesk, fontWeight:300, letterSpacing:'0.02em', transition:'color .2s' }}
                  onMouseEnter={e=>e.currentTarget.style.color=T.plum}
                  onMouseLeave={e=>e.currentTarget.style.color=T.dim}>
                  <span style={{ width:16, height:16, border:`1px solid ${T.rule}`, borderRadius:3, display:'flex', alignItems:'center', justifyContent:'center', fontSize:7, flexShrink:0, fontFamily:grotesk, fontWeight:600, letterSpacing:'0.05em' }}>tt</span>
                  tiktok.com/@lliam.humphrey
                </a>
                <div style={{ marginTop:16, display:'flex', alignItems:'center', gap:14 }}>
                  <div style={{ width:28, height:1, background:T.plum }} />
                  <span style={{ fontFamily:grotesk, fontSize:9, letterSpacing:'0.32em', textTransform:'uppercase', color:T.plum, fontWeight:500 }}>What I'm building</span>
                </div>
              </div>
            </div>

            {/* Right: tall photo strip */}
            <div style={{ width:'clamp(180px,22vw,320px)', flexShrink:0, alignSelf:'stretch', overflow:'hidden', position:'relative' }}>
              <img src="./assets/lliam.jpg" alt="Lliam Humphrey" style={{ width:'100%', height:'100%', objectFit:'cover', objectPosition:'center 15%', display:'block' }} />
              <div style={{ position:'absolute', inset:0, background:'linear-gradient(to right, #0A0709 0%, transparent 35%)', pointerEvents:'none' }} />
              <div style={{ position:'absolute', inset:0, background:'linear-gradient(to bottom, #0A0709 0%, transparent 18%, transparent 80%, #0A0709 100%)', pointerEvents:'none' }} />
            </div>
          </header>

          {/* ── STORY ── */}
          <section style={{ padding:'clamp(80px,10vw,120px) clamp(32px,5vw,80px)', borderTop:`1px solid ${T.rule}` }}>
            <div data-reveal="story" style={reveal('story')}>
              <div style={{ fontSize:9, color:T.plum, letterSpacing:'0.4em', textTransform:'uppercase', marginBottom:36, fontFamily:grotesk, fontWeight:500 }}>Story</div>
              <p style={{ fontFamily:grotesk, fontWeight:500, fontSize:'clamp(36px,5.8vw,86px)', lineHeight:1.05, letterSpacing:'-0.02em', color:T.ink, maxWidth:1100, margin:0 }}>
                My story began in a hotel in South Africa.{' '}
                <span style={{ display:'block', color:T.plum }}>
                  Minimum wage. 10-12 hour days. No room to grow.
                </span>
                I decided that couldn't be me.
              </p>
            </div>
          </section>

          {/* ── VENTURES ── */}
          <section id="ventures" style={{ padding:'clamp(56px,7vw,96px) clamp(32px,5vw,80px)' }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', paddingBottom:20, borderBottom:`1px solid ${T.rule}`, marginBottom:32 }}>
              <h2 style={{ fontFamily:grotesk, fontWeight:500, fontSize:'clamp(24px,3.5vw,44px)', letterSpacing:'-0.05em', color:T.ink, margin:0 }}>
                What I'm building.{' '}
                <span style={{ color:T.plum }}>Two ventures.</span>
              </h2>
            </div>
            <div data-reveal="cards" style={{ ...reveal('cards'), display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(300px,1fr))', gap:16 }}>
              <VentureCard num={1} eyebrow="Private Network" title="Private Victories Club"
                desc="Africa's private network for entrepreneurs scaling their businesses."
                cta="Learn More" onCta={onWaitlist} />
              <VentureCard num={2} eyebrow="Setter Management" title="Art of Sales"
                desc="Training for young South Africans moving from a regular job into remote sales."
                cta="View Programme" href="/artofsales" />
            </div>
          </section>

          {/* ── ABOUT ── */}
          <section id="about" style={{ padding:'clamp(72px,9vw,120px) clamp(32px,5vw,80px)', background:T.warm, borderTop:`1px solid ${T.rule}` }}>
            <div style={{ maxWidth:700 }}>
              <div style={{ fontSize:9, color:T.plum, letterSpacing:'0.4em', textTransform:'uppercase', marginBottom:36, fontFamily:grotesk, fontWeight:500 }}>About</div>
              <div data-reveal="about" style={reveal('about')}>
                <p style={{ fontFamily:grotesk, fontWeight:300, fontSize:'clamp(16px,1.6vw,19px)', lineHeight:1.9, color:T.dim, margin:0 }}>
                  I'm a 20 year old South African entrepreneur who took a gap year in 2025 to figure out my life. That landed me at a hotel working 10-12 hour days for minimum wage. I wanted out when I realised there was no room for growth, so in September 2025 I posted my first piece of content to build my personal brand. I've spent the last year inside high-ticket sales, remote setting, and eventually on a team doing $1M a month. That's where Private Victories and Setter Management Co. both came from: the same instinct, pointed at two different problems. Look at what's actually happening, not what people assume is happening. Then build something from it.
                </p>
              </div>
            </div>
          </section>

          {/* ── QUOTE ── */}
          <section style={{ padding:'clamp(80px,10vw,120px) clamp(32px,5vw,80px)', textAlign:'center', borderTop:`1px solid ${T.rule}` }}>
            <div data-reveal="quote" style={reveal('quote')}>
              <div style={{ width:1, height:48, background:T.plum, margin:'0 auto 40px' }} />
              <blockquote style={{ fontFamily:grotesk, fontWeight:300, fontSize:'clamp(22px,4vw,60px)', lineHeight:1.2, letterSpacing:'-0.04em', color:T.ink, maxWidth:960, margin:'0 auto' }}>
                The wins you have in public are proportionate to the victories you have in private.
              </blockquote>
            </div>
          </section>

          {/* ── FOOTER ── */}
          <footer style={{ padding:'clamp(28px,4vw,40px) clamp(32px,5vw,80px)', borderTop:`1px solid ${T.rule}`, display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:16 }}>
            <span style={{ fontFamily:grotesk, fontSize:9, letterSpacing:'0.32em', textTransform:'uppercase', color:T.faint }}>© MMXXVI · Lliam Humphrey · South Africa</span>
            <div style={{ display:'flex', gap:28 }}>
              {[['Instagram','https://instagram.com/lliam.humphrey'],['TikTok','https://tiktok.com/@lliam.humphrey']].map(([label,href]) => (
                <a key={label} href={href} target="_blank" rel="noopener noreferrer" style={{ fontFamily:grotesk, fontSize:9, letterSpacing:'0.28em', textTransform:'uppercase', color:T.faint, textDecoration:'none', transition:'color .2s' }}
                  onMouseEnter={e=>e.currentTarget.style.color=T.plum}
                  onMouseLeave={e=>e.currentTarget.style.color=T.faint}
                >{label}</a>
              ))}
            </div>
          </footer>

        </div>
      );
    };

    // ─── App ──────────────────────────────────────────────────────────
    function App() {
      const [waitlistOpen, setWaitlistOpen] = useState(false);
      const [setterOpen,   setSetterOpen]   = useState(false);
      return (
        <>
          <SideNav />
          <div className="site-wrap" style={{ marginLeft:44 }}>
            <Hub onWaitlist={()=>setWaitlistOpen(true)} onSetter={()=>setSetterOpen(true)} />
          </div>
          <WaitlistModal open={waitlistOpen} onClose={()=>setWaitlistOpen(false)} />
          <SetterModal   open={setterOpen}   onClose={()=>setSetterOpen(false)} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
