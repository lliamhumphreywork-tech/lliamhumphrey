<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omnipresence OS</title>
<style>
:root{--bg:#fff;--ink:#14110a;--mute:#7a7364;--line:#e8e1d3;--card:#fcfaf5;--copper:#c67f52;--dark:#0c0b05;--warn:#a3341f;--ok:#2f6b3a}
@media (prefers-color-scheme:dark){:root{--bg:#0c0b05;--ink:#fcf2d6;--mute:#a79f8a;--line:#2b2614;--card:#14120a;--copper:#e6ba83;--dark:#fcf2d6;--warn:#ff8a73;--ok:#8fd19b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Geist",Inter,system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line)}
.brand{font-weight:300;letter-spacing:.22em;font-size:13px;margin-right:auto}.brand b{font-weight:600}
select,button,textarea{font:inherit;color:var(--ink)}
select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer}
button:hover{border-color:var(--copper)}
button.primary{background:var(--dark);color:var(--bg);border-color:var(--dark)}
nav{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:14px 14px;color:var(--mute);white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--copper)}
nav span{background:var(--line);border-radius:999px;font-size:11px;padding:1px 7px;margin-left:6px}
main{max-width:820px;margin:0 auto;padding:24px 16px 80px}
.msg{padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px;border:1px solid var(--line);background:var(--card)}
.msg.bad{color:var(--warn);border-color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.top{display:flex;justify-content:space-between;gap:8px;color:var(--mute);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
textarea{width:100%;min-height:220px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;line-height:1.55}
.note{color:var(--mute);font-size:13px;margin:10px 0}
.src{font-size:13px;margin:10px 0}.src a{color:var(--copper);word-break:break-all}
.src div{margin:2px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.empty{color:var(--mute);text-align:center;padding:60px 0}
.late{color:var(--warn)}
</style>
</head>
<body>
<header>
  <div class="brand"><b>OMNI</b>PRESENCE OS</div>
  <select id="client" aria-label="Client"></select>
  <select id="week" aria-label="Week"></select>
  <button id="draft" class="primary">Draft this week</button>
</header>
<nav id="tabs"></nav>
<main><div id="msg"></div><div id="cards"></div></main>
<script>
const TABS=[["draft","Draft"],["needs_ok","Needs OK"],["approved","Approved"],["scheduled","Scheduled"],["posted","Posted"]];
const NEXT={draft:[["needs_ok","Send for OK"],["approved","Approve"]],needs_ok:[["approved","Approve"],["draft","Back to draft"]],approved:[["scheduled","Mark scheduled"],["draft","Back to draft"]],scheduled:[["posted","Mark posted"],["approved","Unschedule"]],posted:[]};
let state={posts:[],job:"",problems:[]},tab="draft";
const $=id=>document.getElementById(id);
const HOSTED=!["localhost","127.0.0.1"].includes(location.hostname);
async function api(p,b){
  let url=p,body=b;
  if(HOSTED){const u=new URL(p,location.origin);const op=u.pathname.replace("/api/","");u.searchParams.set("op",op);url="/api/omni-os"+u.search;if(b)body={...b,op}}
  const r=await fetch(url,b?{method:"POST",headers:{"Content-Type":"application/json","X-OS":"1"},body:JSON.stringify(body)}:{});
  if(r.status===401&&HOSTED){
    const pw=prompt("Password");if(!pw)throw new Error("login");
    const l=await fetch("/api/omni-os",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op:"login",password:pw})});
    if(!l.ok){alert("Wrong password");throw new Error("login")}
    return api(p,b);
  }
  return r.json();
}
const cur=()=>({client:$("client").value,week:$("week").value});
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
async function boot(){
  if(HOSTED)$("draft").style.display="none";
  const cl=await api("/api/clients");
  if(!Array.isArray(cl)){$("msg").append(el("div","msg bad","Server problem: "+(cl.error||"unknown")));return}
  if(!cl.length)$("msg").append(el("div","msg","No weeks pushed yet. On your Mac run ./os push lliam 2026-W45"));
  cl.forEach(c=>$("client").append(new Option(c,c)));
  $("client").onchange=loadWeeks;$("week").onchange=load;
  if(HOSTED)$("draft").style.display="none";else $("draft").onclick=startDraft;
  try{tab=localStorage.getItem("osTab")||"draft"}catch(e){}
  await loadWeeks();
}
async function loadWeeks(){
  const ws=await api("/api/weeks?client="+$("client").value);
  $("week").replaceChildren(...ws.map(w=>new Option(w,w)));
  await load();
}
async function load(){
  const {client,week}=cur();
  state=await api(`/api/posts?client=${client}&week=${week}`);
  if(!state.posts)state={posts:[],job:"",problems:[]};
  render();
  if(state.job==="running")setTimeout(load,4000);
}
async function startDraft(){
  if(state.posts.length){alert("This week already has drafts. To replace them run ./os draft "+cur().client+" "+cur().week+" --force");return}
  await api("/api/draft",cur());await load();
}
function render(){
  const nav=$("tabs");nav.replaceChildren();
  TABS.forEach(([k,l])=>{
    const b=el("button",k===tab?"on":"",l);
    b.append(el("span","",state.posts.filter(p=>p.status===k).length));
    b.onclick=()=>{tab=k;try{localStorage.setItem("osTab",k)}catch(e){}render()};
    nav.append(b);
  });
  const m=$("msg");m.replaceChildren();
  if(state.job==="running")m.append(el("div","msg","Researching and drafting. This takes two to five minutes; the page updates itself."));
  else if(state.job.startsWith("error"))m.append(el("div","msg bad",state.job));
  if(state.problems.length){const d=el("div","msg bad","Checker: "+state.problems.join(" | "));m.append(d)}
  const box=$("cards");box.replaceChildren();
  const list=state.posts.filter(p=>p.status===tab);
  if(!list.length){box.append(el("div","empty",state.posts.length?"Nothing in this tab.":"No drafts for this week yet. Run ./os draft then ./os push on your Mac."));return}
  const today=new Date().toISOString().slice(0,10);
  list.forEach(p=>{
    const c=el("div","card");
    const top=el("div","top");
    const day=el("span",p.day<today&&!["scheduled","posted"].includes(p.status)?"late":"",`Post ${p.n} · ${p.day}${p.day<today&&!["scheduled","posted"].includes(p.status)?" · overdue":""}`);
    top.append(day,el("span","",p.text.split(/\s+/).length+" words"));
    const ta=el("textarea");ta.value=p.text;
    const save=el("button","","Save edits");
    save.onclick=async()=>{await api("/api/save",{...cur(),n:p.n,text:ta.value});save.textContent="Saved";setTimeout(()=>save.textContent="Save edits",1200);load()};
    c.append(top,ta);
    if(p.note)c.append(el("div","note","Note: "+p.note));
    const s=el("div","src");
    p.figures.forEach(f=>{const [a,u]=f.split("|").map(x=>x.trim());const d=el("div");d.append(el("strong","",a+" "));const l=el("a","",u);l.href=u;l.target="_blank";l.rel="noopener";d.append(l);s.append(d)});
    p.sources.filter(u=>!p.figures.some(f=>f.includes(u))).forEach(u=>{const d=el("div");const l=el("a","",u);l.href=u;l.target="_blank";l.rel="noopener";d.append(l);s.append(d)});
    c.append(s);
    const row=el("div","row");
    NEXT[p.status].forEach(([st,l],i)=>{
      const b=el("button",i===(p.status==="draft"?1:0)&&st!=="draft"?"primary":"",l);
      b.onclick=async()=>{await api("/api/save",{...cur(),n:p.n,text:ta.value,status:st});load()};
      row.append(b);
    });
    const cp=el("button","","Copy text");
    cp.onclick=()=>navigator.clipboard.writeText(ta.value).then(()=>{cp.textContent="Copied";setTimeout(()=>cp.textContent="Copy text",1200)});
    row.append(save,cp);c.append(row);box.append(c);
  });
}
boot();
</script>
</body>
</html>
